tool_profiles:
  functions.get_pr:
    tool_name: functions.get_pr
    parameters:
    - name: pr_number
      type: integer
      description: The pull request number to fetch.
      required: true
    input_format: 'Exactly one argument: a JSON object containing the required field pr_number as an integer
      (not a string). No other fields are defined.'
    output_format: Returns an "any" typed output (not strictly schema-validated). Expected to include
      PR title, PR author, and PR diff (patch content). Exact field names may vary by implementation;
      consumers inspect returned keys.
    restrictions:
    - Fetch only by PR number; no parameter for repository selection (repo context assumed to be the current
      mono-repo environment the tools run against).
    - No filtering/partial retrieval controls (cannot request only metadata or only diff via parameters).
    - Read-only; no mutation (does not update PR state).
    - 'Implementation-dependent practical limits: very large diffs may be truncated or hit platform/tooling
      limits.'
    - Access permissions may prevent fetching PRs you don’t have access to.
    - Nonexistent PR numbers will error or return a not-found style response.
    examples:
    - '{ "pr_number": 42 }'
    - 'functions.get_pr({ "pr_number": 42 })'
    security_notes: Access permissions may prevent fetching PRs you don’t have access to.
  functions.run_ci_command:
    tool_name: functions.run_ci_command
    parameters:
    - name: command
      type: string
      description: The shell command to run on the CI/build host (e.g., pytest -q, make test, npm test,
        bazel test //...).
      required: true
    - name: pr_number
      type: integer | null
      description: Pull request number the CI run is associated with for correlation/reporting; omit or
        set to null if not tied to a PR.
      required: false
    input_format: 'A single JSON object only (per tool schema) containing {"command": <string>, "pr_number":
      <integer|null optional>}. The command value is a plain string containing whatever you''d type in
      a shell.'
    output_format: A structured result representing what happened when the command ran on the build host.
      At minimum includes captured stdout and stderr. May also include metadata such as exit status/return
      code depending on the underlying CI runner (not guaranteed).
    restrictions:
    - Runs on a CI/build host; environment and permissions are limited to what the build host user/environment
      allow (may not have access to secrets, may have restricted network, limited filesystem access, etc.).
    - Repository context is usually a workspace containing the repo checkout (often on the PR branch when
      pr_number is provided), but exact checkout behavior depends on CI setup.
    - CI runners commonly enforce timeouts, CPU/memory limits, and output/log-size limits; long-running
      or extremely verbose commands may be truncated or killed.
    - Should generally not be used to run destructive or suspicious commands (e.g., rm -rf, crypto-mining,
      port scans); CI environments often block or monitor suspicious activity.
    examples:
    - '{"command": "pytest -q", "pr_number": 123}'
    - '{"command": "npm run lint"}'
    - '{"command": "make test", "pr_number": 123}'
    security_notes: Environment/permissions constraints may include lack of access to secrets, restricted
      network, and limited filesystem access. Avoid destructive/suspicious commands (e.g., rm -rf, crypto-mining,
      port scans); CI environments often block or monitor such activity.
  functions.post_review_comment:
    tool_name: functions.post_review_comment
    parameters:
    - name: pr_number
      type: integer
      description: The pull request number to comment on.
      required: true
    - name: body
      type: string
      description: The comment text; interpreted as Markdown.
      required: true
    input_format: Only JSON object input with required fields pr_number (integer) and body (string). The
      body string supports Markdown formatting.
    output_format: Returns any; exact structure not specified. In practice may indicate success/failure
      and possibly metadata about the created comment (e.g., ID, URL, timestamps), but response shape
      should not be relied upon unless documented elsewhere.
    restrictions:
    - Posts a review comment at the PR level (general review note), not necessarily an inline, line-specific
      comment.
    - Markdown-based rendering; raw HTML support (if any) depends on the underlying PR platform and should
      not be assumed.
    - Can only comment where the tool’s credentials have permission (e.g., private repo access, ability
      to comment on PRs).
    - Practical limits may exist (max comment size, rate limiting, spam/abuse filters); not specified
      in the tool schema, so large comments or high-frequency posting may be constrained.
    - 'No side effects beyond commenting: it won’t update code, change PR status, or merge.'
    examples:
    - "{\n  \"pr_number\": 123,\n  \"body\": \"## Review\\nLooks good overall.\"\n}"
    - "{\n  \"pr_number\": 42,\n  \"body\": \"## Review summary\\n\\n- ✅ Tests pass locally\\n- ⚠️ Consider\
      \ renaming `foo` to `userId` for clarity\\n\\n### Suggestion\\n```diff\\n- const foo = req.params.id;\\\
      n+ const userId = req.params.id;\\n```\"\n}"
    security_notes: Requires credentials with permission to comment on the target pull request (including
      private repo access where applicable).
  functions.merge_pr:
    tool_name: functions.merge_pr
    parameters:
    - name: pr_number
      type: integer
      description: The numeric ID of the pull request to merge.
      required: true
    input_format: A single JSON object only (not freeform text) with the required field pr_number; no
      optional fields supported.
    output_format: Returns `any` (opaque/arbitrary structured object). In practice may include whether
      the merge succeeded/failed, possibly a merge commit SHA or status message, or an error object/message
      if it can’t merge.
    restrictions:
    - Merges into the main branch only; cannot specify a different target branch via parameters.
    - Requires a valid PR number for a PR that exists and is mergeable.
    - Mergeability is governed by repo rules (e.g., required status checks, required reviews, merge conflicts,
      branch protections preventing merges by automation).
    - No control over merge method via this interface (no squash/rebase/merge selection), unless server-side
      implementation chooses a default.
    examples:
    - '{ "pr_number": 123 }'
    - '{ "pr_number": 42 }'
    - 'functions.merge_pr({ "pr_number": 42 })'
    security_notes: Branch protections may prevent merges by automation; mergeability is governed by repo
      rules.
  functions.list_pull_requests:
    tool_name: functions.list_pull_requests
    parameters:
    - name: repo
      type: string
      description: 'Filters PRs to a specific repository. If empty (""), lists PRs across repos accessible
        to the assistant. If provided, should be a repo identifier understood by the environment (example
        given: "acme/mono-repo").'
      required: false
    - name: status
      type: string
      description: Filters PRs by lifecycle state. Default is "open". Other values may be supported depending
        on backend (often "closed", "all", maybe "merged"), but only "open" is guaranteed by the tool
        schema as described.
      required: false
    input_format: 'JSON object/dictionary (not freeform text; not an array as the top-level object). Schema
      shape: {"repo":"","status":"open"}. Valid examples include {"repo":"","status":"open"}, {"repo":"acme/mono-repo"},
      or {"status":"open"}.'
    output_format: 'Structured result (any-typed object). In practice: a list/array of PR entries including
      PR number/identifier, author, title, branch (source branch), and CI status (e.g., pass/fail/pending/unknown).
      May include extra fields like URL, updated timestamp, base branch (not guaranteed).'
    restrictions:
    - Does not fetch diffs or file changes (agent suggests using functions.get_pr for that).
    - Does not run CI (agent suggests using functions.run_ci_command).
    - Does not merge PRs (agent suggests using functions.merge_pr).
    - Visibility limited to PRs in repositories the assistant has access to.
    - May have pagination/implicit cap on number of PRs returned (e.g., first N); may need to filter by
      repo/status to narrow results.
    - Only certain status values will be recognized; unknown values may yield empty results or an error
      depending on implementation.
    examples:
    - '{"repo":"","status":"open"}'
    - '{"repo":"acme/mono-repo","status":"open"}'
    - '{"repo":"acme/mono-repo","status":"closed"}'
    security_notes: 'Access control/visibility: only PRs in repositories the assistant has access to.
      No other security details specified.'
  functions.get_file_contents:
    tool_name: functions.get_file_contents
    parameters:
    - name: path
      type: string
      description: Repository-relative file path to read.
      required: true
    - name: ref
      type: string
      description: Git reference to read from (branch/tag/commit). Defaults to "main" if omitted.
      required: false
    input_format: 'JSON object (not freeform text) with shape { "path": "path/to/file", "ref": "some-ref"
      }. Minimal valid input is { "path": "README.md" } which uses default ref="main".'
    output_format: Structured object (typed as returning any). In practice expected to include the file
      contents as text and may include additional metadata such as resolved path, ref used, or an error
      payload if the file/ref doesn’t exist.
    restrictions:
    - Single file only; reads one file per call and doesn’t glob directories.
    - Must be in-repo and exist at the given ref; if path doesn’t exist at that ref, you’ll get an error.
    - Won’t read arbitrary filesystem paths outside the repo.
    - Best suited to text files; binary files may return unreadable output or may be blocked/limited depending
      on the backend.
    - Large files may be truncated or rejected depending on platform limits (not specified).
    - 'Access control applies: you can only read what the tool’s execution environment is permitted to
      access (e.g., the repo this assistant is operating on).'
    examples:
    - '{ "path": "README.md" }'
    - '{ "path": "services/api/src/index.ts", "ref": "feature/add-metrics" }'
    - '{ "path": "package.json", "ref": "3f2c1b9e7a0d4f8c0b1d2e3f4a5b6c7d8e9f0123" }'
    security_notes: Access is limited to what the execution environment permits (e.g., the repo this assistant
      is operating on). The tool won’t read arbitrary filesystem paths outside the repo.
  functions.upload_file:
    tool_name: functions.upload_file
    parameters:
    - name: filename
      type: string
      description: The destination filename to create on the build host (e.g., "script.py", "tools/check.ts",
        "tmp/my_config.json" depending on what the host allows).
      required: true
    - name: content
      type: string
      description: The full contents to write into the file as plain text in a single string (can include
        newlines).
      required: true
    input_format: 'JSON only: a single JSON object containing two required string fields: filename and
      content. Multiline content is supported via embedded \n newlines. For non-text/binary data, the
      agent notes this tool is not ideal unless you encode it into text (e.g., base64) and decode later
      on-host.'
    output_format: Schema returns "any" (implementation-defined). In practice may include success/failure
      confirmation, possibly the resolved path where the file was written, and possibly metadata such
      as size/checksum (not guaranteed). Treat as a success indicator plus optional metadata; do not depend
      on a fixed structure unless documented by the environment.
    restrictions:
    - 'Text-oriented: best for source files, configs, scripts.'
    - Size limits likely exist but are not specified; for large files prefer checking into the repo or
      generating on-host.
    - 'Path/filename restrictions may apply: host may restrict writing outside a workspace directory.'
    - Path traversal like "../" may be blocked or sanitized.
    - Uploading does not execute anything; execution is separate (e.g., via functions.run_file or functions.run_ci_command).
    - Build host likely runs in a sandbox with limited permissions and network access (depends on CI environment).
    - File permissions/exec bits may not be preserved or settable via this tool alone.
    examples:
    - 'Upload a Python script: {"filename":"hello.py","content":"print(''hello from uploaded file'')\n"}
      (then run separately with functions.run_file using {"filename":"hello.py"}).'
    - 'Upload a shell script: {"filename":"scripts/check_env.sh","content":"#!/usr/bin/env bash\nset -euo
      pipefail\necho \"PWD=$PWD\"\n"} (then run separately with functions.run_ci_command using {"command":"bash
      scripts/check_env.sh"}).'
    security_notes: Agent notes the build host likely runs in a sandbox with limited permissions and network
      access (CI-dependent). Path traversal (e.g., "../") may be blocked or sanitized, and writing outside
      a workspace directory may be restricted. File permissions/exec bits may not be preserved or settable
      via this tool alone.
  functions.run_file:
    tool_name: functions.run_file
    parameters:
    - name: filename
      type: string
      description: The name of a file that has already been uploaded to the build host.
      required: true
    input_format: Single JSON object only, with a required string field `filename`. File content is not
      passed to `run_file`; it must be uploaded first (typically via `functions.upload_file({ filename,
      content })`).
    output_format: Returns captured stdout/stderr from executing the file on the build/CI host. The agent
      notes you should expect standard output and standard error, and usually an exit status/return code
      (often present, but not guaranteed).
    restrictions:
    - Only runs files that have been previously uploaded to the build host and referenced by `filename`.
    - No other supported parameters beyond `filename` (no args/env/cwd fields).
    - Execution environment constraints depend on what is installed on the host (OS/shell/runtime availability
      such as Bash/Python).
    - Network access may be restricted by CI policy.
    - Execution time, CPU, memory, and output size may be capped by the CI system.
    - Runs with whatever user the CI host uses; privileged operations (e.g., sudo, binding privileged
      ports, writing to restricted paths) may be blocked.
    - Because there are no explicit arguments, script parameters generally must be hard-coded, read from
      environment variables (if provided), or encoded some other way.
    examples:
    - 'Upload then run a bash script: upload `hello.sh` with content `#!/usr/bin/env bash\nset -euo pipefail\necho
      "Hello from the build host"\n`, then call `functions.run_file({"filename":"hello.sh"})` and expect
      stdout `Hello from the build host`.'
    - 'Upload then run a Python file: upload `check.py` with content `import sys\nprint(''ok'')\nsys.exit(0)\n`,
      then call `functions.run_file({"filename":"check.py"})`; whether it works depends on host execution
      support for `.py` (shebang/executable permissions or wrapper).'
    security_notes: 'Runs on a CI/build host with environment/policy constraints: network access may be
      restricted; execution time/CPU/memory/output may be capped; runs as the CI host user and privileged
      operations (sudo, binding privileged ports, writing to restricted paths) may be blocked. Only previously
      uploaded files can be executed.'
  multi_tool_use.parallel:
    tool_name: multi_tool_use.parallel
    parameters:
    - name: tool_uses
      type: array
      description: Array of tool-call descriptors; each entry describes one tool call to execute in parallel.
        Each descriptor includes recipient_name ("functions.<function_name>") and parameters (object matching
        the target tool schema).
      required: true
    input_format: 'A single structured JSON object with shape { "tool_uses": [ { "recipient_name": "functions.<tool_name>",
      "parameters": { ... } } ] }. No freeform string input mode; each parameters value is a JSON object
      matching the underlying tool’s schema.'
    output_format: A combined result containing one result per tool call, in the same order as tool_uses.
      Each element is whatever the underlying tool normally returns (e.g., PR data, stdout/stderr, file
      contents), with exact fields depending on the underlying tool.
    restrictions:
    - Use only when calls are independent; if one call depends on another’s output, they must be run sequentially.
    - Only tools in the functions.* namespace are permitted; cannot call another namespace through this
      wrapper.
    - Each tool call must supply parameters matching that tool’s schema; one call may fail even if others
      succeed.
    - Parallel calls can conflict if they mutate shared state (e.g., writing to the same build directory
      or using the same filename); the wrapper does not isolate side effects—use unique filenames/paths
      or run sequentially.
    - There may be internal practical/system limits (rate limits, compute limits, etc.); keep the number
      of parallel calls reasonable and independent.
    examples:
    - '{ "tool_uses": [ { "recipient_name": "functions.get_pr", "parameters": { "pr_number": 42 } }, {
      "recipient_name": "functions.run_ci_command", "parameters": { "command": "pytest -q", "pr_number":
      42 } } ] }'
    - '{ "tool_uses": [ { "recipient_name": "functions.get_file_contents", "parameters": { "path": "README.md",
      "ref": "main" } }, { "recipient_name": "functions.get_file_contents", "parameters": { "path": "pyproject.toml",
      "ref": "main" } } ] }'
    security_notes: 'Access control noted: only functions.* tools are allowed via this wrapper (namespace
      restriction). Side-effect risk noted: parallel calls may step on each other when mutating shared
      state (e.g., same build directory or same filename), and the wrapper does not isolate those effects.'
