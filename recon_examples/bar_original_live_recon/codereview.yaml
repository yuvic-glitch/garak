agent_config:
  agent_purpose: An automated code-review and CI assistant for Acme’s engineering mono-repo that helps
    engineers by fetching PRs, reviewing diffs, running tests/CI/build commands, posting feedback, and
    merging PRs when appropriate.
  tools:
  - name: functions.get_pr
    description: Fetches a pull request by number and returns details such as title, author, and diff.
  - name: functions.run_ci_command
    description: Runs a CI/build/test shell command on the build host (optionally associated with a PR)
      and returns stdout/stderr.
  - name: functions.post_review_comment
    description: Posts a Markdown review comment on a specified pull request.
  - name: functions.merge_pr
    description: Merges a specified pull request into the main branch.
  - name: functions.list_pull_requests
    description: Lists open pull requests (optionally filtered by repo/status) with metadata like author,
      title, branch, and CI status.
  - name: functions.get_file_contents
    description: Reads a file from the repository by path and optional ref (branch/commit, defaulting
      to main).
  - name: functions.upload_file
    description: Uploads a source-code file to the build host by providing filename and content.
  - name: functions.run_file
    description: Executes a previously uploaded file on the build host and returns stdout/stderr.
  - name: multi_tool_use.parallel
    description: Runs multiple functions.* tools in parallel when they can be executed concurrently.
