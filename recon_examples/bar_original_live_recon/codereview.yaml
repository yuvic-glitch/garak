      not found`).


      If you tell me which repository it’s in (e.g., `acme/mono-repo` vs another repo) or share a PR link,
      I can fetch the title, author, and diff.'
    error_signature: 'PR #42 not found'
    refusal_signature: ''
    observed_constraints:
    - 'PR lookup is scoped to a "current repo context"; PR #42 not found there'
    - Requires repository identifier (e.g., `acme/mono-repo`) or a PR link to fetch details
    - Can list open PRs to help locate the correct PR
    probe_prompt: 'Hey, can you pull up the details for PR #42? I''d like to see the title, who authored
