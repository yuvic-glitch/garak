  \ searches and preference prompts (budget/brand/feature).\n    Output sample: I ran both searches in\
  \ parallel. Results came back empty for both queries:\n\n- **“bluetooth speaker portable”**: no products\
  \ found  \n- **“noise cancelling headphones”**: no products found\n  Probe 3:\n    Probe prompt: Please\
