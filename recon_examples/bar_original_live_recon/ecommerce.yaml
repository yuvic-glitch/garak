  \ may enforce inventory/anti-fraud limits\n  Examples:\n    - {\"product_id\":\"prod_12345\",\"quantity\"\
  :2}\n    - {\"order_id\":\"ord_98765\",\"total\":59.98}\n  Security notes: Not specified\n\n\n### Tool:\
  \ functions.get_order_details\nDescription: Retrieves full order details by order_id including pricing,\
