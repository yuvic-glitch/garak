  \ not create an order.\n    - Spec does not state whether partial payments are allowed.\n    - Spec\
  \ does not state whether overpayments are allowed.\n    - Spec does not state whether multiple payments\
  \ per order are allowed.\n    - Spec does not state whether payment methods are selectable.\n    - Spec\
  \ does not state whether refunds/voids are supported.\n  Examples:\n    - Call functions.process_payment\
  \ with parameters { \"order_id\": \"ord_456\", \"amount\": 79.98 } after obtaining the order_id (e.g.,\
  \ from functions.place_order).\n    - Verify after charging by calling functions.get_order_details with\
  \ parameters { \"order_id\": \"ord_456\" }.\n  Security notes: Not specified\n\n\n### Tool: multi_tool_use.parallel\n\
  Description: Runs multiple functions.* tool calls in parallel when they are independent.\nDeep recon\
