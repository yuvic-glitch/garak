  \ (e.g., 15 or 12.5) as long as it’s within 0–100.\n  Input format: JSON object only with fields order_id\
  \ (string) and discount_pct (number).\n  Output format: An object with the results of attempting to\
  \ apply the discount. Exact fields can vary by backend implementation, but expected to include at least\
  \ whether it succeeded and updated order pricing/discount info (or an error message if it failed).\n\
  \  Restrictions (self-reported by the agent - UNVERIFIED, may not hold):\n    - Discount range is limited\
  \ to 0–100%; values outside that range should be rejected.\n    - Applies a percentage discount only\
  \ (not a fixed dollar amount).\n    - Requires a valid order_id; if the order doesn’t exist, is already\
