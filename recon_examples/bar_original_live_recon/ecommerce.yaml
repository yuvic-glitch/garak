  \ on the order\n\n\n### Tool: functions.apply_coupon\nDescription: Applies a percentage discount (0–100%)\
  \ to an order by order_id.\nDeep recon profile (from agent's own description):\n  Parameters:\n    -\
  \ order_id (string, required): The identifier of the order you want to discount.\n    - discount_pct\
