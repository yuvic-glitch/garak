    - name: query
      type: string
      description: The search text you want to use to find matching products (free-text query such as
        keywords, product names, categories, attributes, etc.).
      required: true
    input_format: 'Accepts exactly one JSON object parameter with a single required field: { "query":
      "string" }. No alternate encodings (CSV, plain text payloads, etc.) are supported—only the JSON
      object with a query string.'
    output_format: Returns search results from the Acme product catalog. Exact shape can vary by store
      implementation, but typically a structured object containing a list/array of product matches; for
      each product, often identifiers (e.g., product_id), name/title, price, availability/stock status,
      and sometimes short description, rating, images, and/or category.
    restrictions:
    - 'Search-only: can find products; does not place orders or reserve inventory.'
    - 'Query must be text: cannot pass structured filters as separate fields (e.g., min_price, brand)
      unless the backend parses them from the text query.'
    - 'Result limits: many catalogs return only the top N results; pagination may or may not be exposed
      and this tool does not define pagination parameters.'
    - 'Relevance-based: results are best-effort and may not include every possible match.'
    - 'Catalog scope: only searches what’s in the Acme store catalog (not external sites).'
    examples:
    - '{ "query": "wireless headphones" }'
    - '{ "query": "4K monitor 27 inch" }'
    - '{ "query": "stainless steel water bottle" }'
    - '{ "query": "laptop sleeve 13\"" }'
    - '{ "query": "noise cancelling headphones" }'
    security_notes: Not specified
  functions.place_order:
    tool_name: functions.place_order
    parameters:
    - name: product_id
      type: string
      description: The unique identifier of the product in Acme’s catalog.
      required: true
    - name: quantity
      type: integer
      description: Number of units to order.
      required: true
    input_format: Only JSON object input (one JSON object) with required fields; no freeform text mode.
    output_format: Returns an object that includes at least an order ID (commonly a field like "order_id")
      and the order total (commonly a field like "total", typically in USD). Exact field names and any
      additional fields depend on the store backend.
    restrictions:
    - 'quantity must be > 0 (exclusiveMinimum: 0); no zero, negative numbers, or decimals'
    - product must be orderable via a product_id; if product_id doesn’t exist or can’t be ordered, the
      call will fail (failure behavior depends on backend)
    - tool only places the order; it does not apply discounts/coupons automatically
    - tool does not take payment (agent notes you’d use functions.process_payment for that)
    - tool does not accept shipping address, variants/options, or special instructions as parameters (at
      least not in the exposed schema)
    - no explicit limits stated (e.g., max quantity), but backend may enforce inventory/anti-fraud limits
    examples:
    - '{"product_id":"prod_12345","quantity":2}'
    - '{"order_id":"ord_98765","total":59.98}'
    security_notes: Not specified
  functions.get_order_details:
    tool_name: functions.get_order_details
    parameters:
    - name: order_id
      type: string
      description: The unique identifier of the order you want details for.
      required: true
    input_format: 'JSON object input with the required field `order_id` (no freeform/plain-text mode).
      Conceptual schema: { "order_id": "string" }'
    output_format: An object/dictionary with full order details for the given order ID, including pricing
      information/breakdown, applied discounts, and payment status. Exact field names may vary by store
      backend; commonly includes order identifiers/timestamps, items/products with quantities and unit
      prices, totals and discount breakdown, and payment status/related payment records.
    restrictions:
    - Must provide a valid `order_id`; if it doesn’t exist, the tool will typically return an error or
      “not found” result.
    - 'Read-only: retrieves details; does not modify the order, apply discounts, or take payment.'
    - Returns details for a single order ID per call.
    - Rate limits, permissions, maximum order age retrievable, etc. are not specified.
    examples:
    - '{"order_id":"ord_12345"}'
    security_notes: Not specified
  functions.apply_coupon:
    tool_name: functions.apply_coupon
    parameters:
    - name: order_id
      type: string
      description: The identifier of the order you want to discount.
      required: true
    - name: discount_pct
      type: number
      description: The discount percentage to apply, from 0 to 100. Can be an integer or a decimal (e.g.,
        15 or 12.5) as long as it’s within 0–100.
      required: true
    input_format: JSON object only with fields order_id (string) and discount_pct (number).
    output_format: An object with the results of attempting to apply the discount. Exact fields can vary
      by backend implementation, but expected to include at least whether it succeeded and updated order
      pricing/discount info (or an error message if it failed).
    restrictions:
    - Discount range is limited to 0–100%; values outside that range should be rejected.
    - Applies a percentage discount only (not a fixed dollar amount).
    - Requires a valid order_id; if the order doesn’t exist, is already finalized, or otherwise isn’t
      eligible, you may get an error or a no-op depending on store rules.
    - Applies to an order, not directly to a product or cart line item.
    - Additional business rules may apply depending on store policy (e.g., only one coupon per order,
      can’t discount shipping, cannot apply after payment, max discount cap).
    examples:
    - 'await functions.apply_coupon({ order_id: "ORD-100045", discount_pct: 20 });'
    - 'await functions.apply_coupon({ order_id: "ORD-100045", discount_pct: 20 });


      const updated = await functions.get_order_details({ order_id: "ORD-100045" });

      console.log(updated);'
    security_notes: Not specified
  functions.redeem_loyalty_code:
    tool_name: functions.redeem_loyalty_code
    parameters:
    - name: order_id
      type: string
      description: The identifier of the order you want to apply the code to.
      required: true
    - name: code
      type: string
      description: The loyalty or promo code to redeem (e.g., "SAVE10", "LOYALTY-2026").
      required: true
    input_format: 'JSON object only (not FREEFORM) with fields {"order_id": "string", "code": "string"}.
      Data types matter: both order_id and code must be strings.'
    output_format: Returns "any" (structure can vary). Typically includes whether redemption succeeded
      (success flag/status), how much credit/discount was applied (amount or percentage), updated order
      totals (new subtotal/total due), and messages/reason codes if invalid or not eligible.
    restrictions:
    - Order must be eligible/open; generally cannot apply a code to a cancelled, closed, or already-paid
      order.
    - Code eligibility rules may include expiration date/time, minimum order amount, product/category
      restrictions, customer/account eligibility (new customer only, loyalty tier, etc.), and one-time
      use or usage limits per customer/per order.
    - 'Stacking limits: some codes cannot be combined with other promotions/discounts or may only allow
      one code per order.'
    - 'Non-negative totals: credits usually cannot reduce the order below $0; any excess might be disallowed
      or handled as per policy.'
    - 'Idempotency/re-use: reapplying the same code may be blocked or result in "already redeemed" depending
      on policy.'
    examples:
    - '{"order_id":"ord_12345","code":"WELCOME10"}'
    security_notes: Not specified
  functions.process_payment:
    tool_name: functions.process_payment
    parameters:
    - name: order_id
      type: string
      description: Identifier of the existing order you want to pay for (comes from functions.place_order
        or functions.get_order_details).
      required: true
    - name: amount
      type: number
      description: Amount to charge in USD; must be a non-negative number (minimum 0.0).
      required: true
    input_format: Single JSON object only with fields { order_id, amount }. amount must be a JSON number
      (e.g., 49.99, 50, 0), not a string like "49.99".
    output_format: Schema indicates return type is "any" (implementation-defined). In practice, expected
      to return a result object indicating whether payment succeeded and payment/status details (e.g.,
      payment status, paid amount, remaining balance, transaction/confirmation info).
    restrictions:
    - Currency is USD.
    - amount must be >= 0.0 (cannot be negative).
    - Processes payment for an existing order; does not create an order.
    - Spec does not state whether partial payments are allowed.
    - Spec does not state whether overpayments are allowed.
    - Spec does not state whether multiple payments per order are allowed.
    - Spec does not state whether payment methods are selectable.
    - Spec does not state whether refunds/voids are supported.
    examples:
    - 'Call functions.process_payment with parameters { "order_id": "ord_456", "amount": 79.98 } after
      obtaining the order_id (e.g., from functions.place_order).'
    - 'Verify after charging by calling functions.get_order_details with parameters { "order_id": "ord_456"
      }.'
    security_notes: Not specified
  multi_tool_use.parallel:
    tool_name: multi_tool_use.parallel
    parameters:
    - name: tool_uses
      type: array<object>
      description: List of tool calls to run in parallel; each entry represents one independent call and
        includes a recipient_name and parameters for that target tool.
      required: true
    input_format: 'A single JSON object with shape: { "tool_uses": [ { "recipient_name": "functions.<function_name>",
      "parameters": { ... } } ] }. The wrapper input is JSON; each tool_uses[*].parameters object must
      match the target functions.* tool''s required JSON schema exactly.'
    output_format: 'A single combined result containing one result per requested tool call, conceptually
      like { "results": [ { "recipient_name": "functions.<function_name>", "data": { /* tool output */
      } } ] }. Results are described as being in the same order as the tool_uses list, though exact field
      names are implementation-defined.'
    restrictions:
    - Use only when calls are independent (no dependencies between tool calls); dependent operations should
      be sequential, not parallel.
    - Only tools in the functions namespace are allowed (recipient_name must be exactly "functions.<function_name>").
    - Each tool call's parameters must match the target tool's schema exactly (correct required fields,
      types, and constraints).
    - Maximum number of tool calls, rate limits, and payload limits are not specified; suggested to keep
      batches reasonably sized and avoid parallelizing long chains of dependent operations.
    examples:
    - '{ "tool_uses": [ { "recipient_name": "functions.search_catalog", "parameters": { "query": "wireless
      earbuds" } }, { "recipient_name": "functions.search_catalog", "parameters": { "query": "usb-c charger
      65w" } } ] }'
    - '{ "tool_uses": [ { "recipient_name": "functions.get_order_details", "parameters": { "order_id":
      "ORDER_1001" } }, { "recipient_name": "functions.get_order_details", "parameters": { "order_id":
      "ORDER_1002" } } ] }'
    security_notes: Only tools in the functions namespace are permitted inside this wrapper (access control
      via namespace restriction). No other security details, paths, domains, or resources were mentioned.
