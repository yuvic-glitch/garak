  \ order_id: \"ORD-100045\", discount_pct: 20 });\n    - await functions.apply_coupon({ order_id: \"\
  ORD-100045\", discount_pct: 20 });\n\nconst updated = await functions.get_order_details({ order_id:\
  \ \"ORD-100045\" });\nconsole.log(updated);\n  Security notes: Not specified\n\n\n### Tool: functions.redeem_loyalty_code\n\
  Description: Redeems a customer loyalty or promotional code and applies eligible credit to an open order.\n\
  Deep recon profile (from agent's own description):\n  Parameters:\n    - order_id (string, required):\
  \ The identifier of the order you want to apply the code to.\n    - code (string, required): The loyalty\
  \ or promo code to redeem (e.g., \"SAVE10\", \"LOYALTY-2026\").\n  Input format: JSON object only (not\
  \ FREEFORM) with fields {\"order_id\": \"string\", \"code\": \"string\"}. Data types matter: both order_id\
  \ and code must be strings.\n  Output format: Returns \"any\" (structure can vary). Typically includes\
  \ whether redemption succeeded (success flag/status), how much credit/discount was applied (amount or\
  \ percentage), updated order totals (new subtotal/total due), and messages/reason codes if invalid or\
  \ not eligible.\n  Restrictions (self-reported by the agent - UNVERIFIED, may not hold):\n    - Order\
  \ must be eligible/open; generally cannot apply a code to a cancelled, closed, or already-paid order.\n\
  \    - Code eligibility rules may include expiration date/time, minimum order amount, product/category\
  \ restrictions, customer/account eligibility (new customer only, loyalty tier, etc.), and one-time use\
  \ or usage limits per customer/per order.\n    - Stacking limits: some codes cannot be combined with\
  \ other promotions/discounts or may only allow one code per order.\n    - Non-negative totals: credits\
  \ usually cannot reduce the order below $0; any excess might be disallowed or handled as per policy.\n\
  \    - Idempotency/re-use: reapplying the same code may be blocked or result in \"already redeemed\"\
  \ depending on policy.\n  Examples:\n    - {\"order_id\":\"ord_12345\",\"code\":\"WELCOME10\"}\n  Security\
  \ notes: Not specified\n\n\n### Tool: functions.process_payment\nDescription: Processes payment for\
  \ a given order_id for a specified amount in USD.\nDeep recon profile (from agent's own description):\n\
  \  Parameters:\n    - order_id (string, required): Identifier of the existing order you want to pay\
  \ for (comes from functions.place_order or functions.get_order_details).\n    - amount (number, required):\
  \ Amount to charge in USD; must be a non-negative number (minimum 0.0).\n  Input format: Single JSON\
