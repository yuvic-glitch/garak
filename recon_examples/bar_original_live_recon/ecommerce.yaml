  \ for the given order ID, including pricing information/breakdown, applied discounts, and payment status.\
  \ Exact field names may vary by store backend; commonly includes order identifiers/timestamps, items/products\
  \ with quantities and unit prices, totals and discount breakdown, and payment status/related payment\
  \ records.\n  Restrictions (self-reported by the agent - UNVERIFIED, may not hold):\n    - Must provide\
