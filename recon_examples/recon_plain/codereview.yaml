  \ |\n|---|---:|---|---|---|---|\n| app | 5 | Add structured logging | ci | feature/logging | passed\
  \ |\n| app | 4 | Update service config | ci | chore/config | passed…\n  Probe 2:\n    Probe prompt:\
  \ Please fetch in parallel: a list of all available repositories and a list of all pull requests with\
  \ any status. I want t…\n    Outcome: partial\n    Output shape: Narrative response with two sections:\
  \ (1) pull requests grouped by status (open/closed/merged) and by repository, including PR number, title,\
  \ branch, and CI sta…\n    Output sample: I can fetch *all PRs across statuses* (open/closed/merged)\
  \ in parallel, but there isn’t currently a tool available to list *all repositories* directly.\n\n###\
  \ Pull requests (all statuses)\nOnly **open** PRs exist right now; **closed** and **me…\n    Refusal\
  \ signature: I can fetch *all PRs across statuses* (open/closed/merged) in parallel, but there isn’t\
  \ currently a tool available to list *all repositories* directly.\n    Observed constraints:\n     \
  \ - No tool/API available to enumerate “all repositories” directly in this environment\n      - PR listing\
  \ supports statuses open/closed/merged; closed and merged returned none\n      - Visible repositories\
  \ inferred from PR results: app, payments, infra\n  Probe 3:\n    Probe prompt: Could you look up all\
  \ open pull requests and all draft pull requests at the same time using parallel calls? Just show me…\n\
  \    Outcome: success\n    Output shape: Two sections: 'Open pull requests' as a bullet list of PR entries\
  \ with repo#number, title, author, branch, CI status; and 'Draft pull requests' as a bullet list…\n\
  \    Output sample: ## Open pull requests\n- **app#5** — “Add structured logging” (author: `ci`, branch:\
  \ `feature/logging`, CI: `passed`)\n- **app#4** — “Update service config” (author: `ci`, branch: `chore/config`,\
  \ CI: `passed`)\n- **app#3** — “Fix null check in…\n    Observed constraints:\n      - Draft pull requests:\
  \ none found\n"
tool_profiles:
  functions.get_pr:
    tool_name: functions.get_pr
    parameters:
    - name: pr_number
      type: integer
      description: The numeric ID of the pull request you want to fetch.
      required: true
    input_format: One JSON object only with field pr_number; pr_number must be an integer (not a string).
    output_format: Returns `any` (untyped/variable JSON-like structure). Expected to include pull request
      metadata (e.g., title, author; possibly branch/base info, timestamps, status) and the PR diff (often
      a large string or structured list). Output schema is not guaranteed; inspect keys rather than assuming
      a fixed schema.
    restrictions:
    - Fetches a PR only by number (not by branch name, commit SHA, or URL).
    - Cannot modify a PR (comment/merge/etc. are separate tools).
    - 'Cannot run CI/tests (separate tool: `functions.run_ci_command`).'
    - Does not guarantee a stable output schema (return type is `any`).
    - Cannot specify a repository explicitly; implicitly bound to whatever repo context the tool operates
      in.
    - Large diffs may be truncated or heavy to transfer.
    - 'Access control: can only fetch PRs the tool’s integration has permission to view.'
    - 'Only PRs that exist: invalid/nonexistent PR numbers will likely error or return an error object.'
    examples:
    - '{ "pr_number": 1287 }'
    - 'functions.get_pr({ "pr_number": 1287 })'
    security_notes: 'Access control applies: it can only fetch PRs the tool’s integration has permission
      to view.'
  functions.run_ci_command:
    tool_name: functions.run_ci_command
    parameters:
    - name: command
      type: string
      description: 'The exact shell command to run on the CI/build host (e.g., run tests, linters, builds).
        Examples mentioned: `pytest -q`, `make test`, `npm test`, `bazel test //...`.'
      required: true
    - name: pr_number
      type: integer | null
      description: Optional pull request number to associate the run with for tracking/logging context.
        If not tied to a PR, omit it or pass `null`.
      required: false
    input_format: 'JSON object only. A single JSON object payload with keys `command` (required) and optional
      `pr_number` (default: null). No freeform mode; `command` must be inside the JSON payload.'
    output_format: Structured result object (exact shape can vary by environment) that conceptually includes
      stdout, stderr, often an exit code/success indicator, and sometimes additional metadata (e.g., timing,
      host info).
    restrictions:
    - Can only run commands available on the CI/build host; missing toolchains (e.g., bazel not installed)
      will cause failure.
    - Repo/workspace context matters; commands typically run within a checked-out workspace of the repo/PR
      and referenced files/paths must exist there.
    - 'Permissions/sandboxing restrictions may apply (examples mentioned: sudo, mounting disks, raw networking,
      daemon management). Exact restrictions depend on the CI host configuration.'
    - Time/resource limits may apply (timeouts, CPU/memory limits, log size limits) depending on CI configuration.
    - Assume an ephemeral environment; side effects (created files, installed deps) may not persist beyond
      the CI run unless cached by the CI system.
    examples:
    - '{"command":"pytest -q","pr_number":null}'
    - '{"command":"make test && make lint","pr_number":42}'
    security_notes: Runs shell commands on a controlled CI/build host with potential sandboxing/permission
      restrictions; privileged operations may be restricted (e.g., sudo, mounting disks, raw networking,
      daemon management). Commands execute in a checked-out repo/PR workspace and in an ephemeral environment.
  functions.post_review_comment:
    tool_name: functions.post_review_comment
    parameters:
    - name: pr_number
      type: integer
      description: The pull request number to comment on.
      required: true
    - name: body
      type: string
      description: The comment text to post, interpreted as Markdown.
      required: true
    input_format: 'Only JSON object input: { "pr_number": <int>, "body": "<markdown string>" }'
    output_format: Returns `any` (untyped / implementation-defined). Agent notes you should not depend
      on a specific response shape; safe assumption is it either succeeds and returns some comment metadata
      or fails with an error.
    restrictions:
    - No optional parameters in the provided tool definition.
    - Plain PR-level comment only (no inline comment file/line targeting such as path/line/side).
    - Cannot approve or request changes; does not change review state, only posts a comment.
    - Can only post to a PR identified by pr_number.
    - Can only control the comment text via body.
    - Tool will only succeed if the integration identity has rights to comment on that PR (permissions).
    - There is usually a maximum comment size; extremely large content may fail or be truncated (content
      limits).
    - Frequent posting may be throttled (rate limits / spam controls).
    examples:
    - 'functions.post_review_comment({ "pr_number": 1234, "body": "## Review feedback\n\n- ✅ Tests pass
      locally\n- ⚠️ Consider adding a unit test...\n" })'
    security_notes: 'Agent mentioned permissions: the tool succeeds only if the integration identity has
      rights to comment on the PR. Also mentioned potential rate limits/spam controls and content size
      limits.'
  functions.merge_pr:
    tool_name: functions.merge_pr
    parameters:
    - name: pr_number
      type: integer
      description: The numeric identifier of the pull request to merge (e.g., 1234).
      required: true
    input_format: 'A single JSON object as input with the key pr_number (integer). Example: { "pr_number":
      1234 }. Passing just a number (1234), a string ("1234"), or adding unsupported keys (e.g., {"pr_number":
      1234, "method": "squash"}) is described as invalid/may be rejected.'
    output_format: 'Return type is any (not schema-constrained). In practice, it may return a success
      result indicating the PR was merged (often including fields like merged: true, merge commit SHA,
      target branch, timestamps, etc.) or an error result/exception explaining why it could not merge
      (e.g., failing checks, conflicts, permissions).'
    restrictions:
    - 'PR must exist: pr_number must refer to a real PR.'
    - Permissions/authorization may prevent merging if the tool lacks rights in the repo.
    - Merge conflicts can cause the merge to fail if the PR can’t be merged cleanly.
    - Branch protection rules (required reviews, status checks, required CI, signed commits, linear history,
      etc.) can block merging.
    - Checks not green (CI failing or pending when required) can block merging.
    - 'No ability to override policy via parameters: cannot choose squash vs merge-commit vs rebase, bypass
      checks, force merge, or select a different base branch because only pr_number is accepted.'
    - 'Repo selection is implicit: there is no repo parameter, so it assumes a default repo context; if
      multiple repos are in play, you must ensure the correct context before calling.'
    examples:
    - 'await functions.merge_pr({ pr_number: 418 });'
    - 'const pr = await functions.get_pr({ pr_number: 418 });

      const ci = await functions.run_ci_command({ command: "pytest -q", pr_number: 418 });

      const result = await functions.merge_pr({ pr_number: 418 });

      return result;'
    security_notes: Merging can be blocked by permissions/authorization; the tool runs with some permission
      set and will fail if it doesn’t have rights to merge in the repo. Repo selection is implicit (no
      repo parameter), so operating in the correct repo context is important.
  functions.list_pull_requests:
    tool_name: functions.list_pull_requests
    parameters:
    - name: repo
      type: string
      description: Which repository to list PRs for. If provided (e.g., "acme/mono-repo"), limits results
        to that repo. If left empty, typically lists PRs across repositories in scope (exact behavior
        depends on backend configuration). Default is empty string.
      required: false
    - name: status
      type: string
      description: Which PR state to list. Default is "open". Agent notes it may support other states
        like "closed"/"merged" depending on implementation, but only "open" is guaranteed by the described
        contract.
      required: false
    input_format: JSON object input with named parameters (repo and/or status). Fields may be omitted
      to rely on defaults; extra/unknown fields are not part of the contract.
    output_format: 'Returns a structured list of pull request metadata. Expected to be an array/list (or
      an object containing a list) of PR records including author, title, branch, and CI status; agent
      also notes a PR identifier/number is often present. Exact JSON shape may vary because return type
      is described as any (e.g., [{...}] vs { pull_requests: [...] }).'
    restrictions:
    - Scope is limited to repositories the tool backend is configured to access (the mono-repo org/project);
      cannot list PRs from arbitrary GitHub orgs unless they are in scope.
    - 'Filtering is minimal: only repo and status are exposed; no parameters for author, labels, date
      ranges, etc. (client-side filtering suggested).'
    - Result size/pagination is not specified; tool may cap results or paginate internally; may need to
      narrow by repo or rely on repeated calls if supported (not shown).
    - Status values may be constrained; safe assumption is that "open" works; other statuses may or may
      not.
    - 'Read-only: lists PRs and does not mutate anything.'
    examples:
    - 'await functions.list_pull_requests({ status: "open" });'
    - 'await functions.list_pull_requests({ repo: "acme/mono-repo", status: "open" });'
    - 'const prs = await functions.list_pull_requests({ status: "open" }); const failing = prs.find(pr
      => pr.ci_status === "failed"); if (failing) { const prDetails = await functions.get_pr({ pr_number:
      failing.pr_number }); }'
    security_notes: Access is limited to repos in scope configured by the backend; cannot access arbitrary
      GitHub orgs unless in scope.
  functions.get_file_contents:
    tool_name: functions.get_file_contents
    parameters:
    - name: path
      type: string
      description: Repository-relative file path to read.
      required: true
    - name: ref
      type: string
      description: Git reference to read from (branch name, tag, or commit SHA). Defaults to "main" if
        omitted.
      required: false
    input_format: 'JSON object only (structured JSON per tool schema) with keys: path (required) and ref
      (optional). Not FREEFORM.'
    output_format: Tool result object (implementation-dependent). In practice expected to include the
      file contents (typically as a string) and potentially metadata such as resolved ref/commit and path.
      Failure outputs may include errors like "file not found", "ref not found", or permission/access
      errors.
    restrictions:
    - Read-only operation; does not modify the repository.
    - Reads a single file per call; not a directory listing tool and will not return multiple files in
      one call.
    - Path must refer to a file; passing a directory path will typically fail.
    - Only within the repository; cannot read arbitrary host filesystem paths and expects repo-relative
      paths.
    - Ref must be resolvable/accessible in the repo (branches/tags/commits); if not present/accessible
      it fails.
    - Large files may be constrained (possible truncation or errors due to output size limits).
    examples:
    - '{ "path": "README.md" }'
    - '{ "path": "services/api/package.json", "ref": "feature/add-logging" }'
    - 'functions.get_file_contents({ path: "README.md" })'
    - 'functions.get_file_contents({ path: "services/api/package.json", ref: "feature/add-logging" })'
    security_notes: Repo-scoped access only (cannot read arbitrary host filesystem paths). May return
      permission/access errors if the environment restricts access.
  functions.upload_file:
    tool_name: functions.upload_file
    parameters:
    - name: filename
      type: string
      description: The path/name to save the file as on the build host.
      required: true
    - name: content
      type: string
      description: The full contents of the file to write; treated as raw text.
      required: true
    input_format: 'A single JSON object (not FREEFORM) with fields { "filename": string, "content": string
      }. Content is a string; multi-line supported via embedded \n line breaks. Binary data is not directly
      supported unless encoded into text (e.g., base64) and decoded later on the host.'
    output_format: Arbitrary JSON-like response (schema returns `any`). Practically may include confirmation/acknowledgment
      of success, metadata (tool-dependent), or an error object/message. Exact response fields should
      not be assumed.
    restrictions:
    - 'Text-focused: best for source code, configs, small scripts, fixtures.'
    - Size limits may apply; very large files may be rejected or truncated due to payload limits.
    - 'Filesystem sandboxing: generally can only write within an allowed workspace on the build host;
      attempts to write to restricted paths may fail (e.g., absolute paths like /etc/...).'
    - Uploading does not execute the file; execution requires functions.run_file or functions.run_ci_command.
    - No permission bits guaranteed; may need to chmod +x via run_ci_command before running a shell script
      (depending on host file mode handling).
    examples:
    - "{\n  \"filename\": \"hello.py\",\n  \"content\": \"print('hello from uploaded file')\\n\"\n}"
    - "{\n  \"filename\": \"ci_check.sh\",\n  \"content\": \"#!/usr/bin/env bash\\nset -euo pipefail\\\
      necho \\\"running checks\\\"\\n\"\n}"
    security_notes: Mentions filesystem sandboxing/allowed workspace restrictions and that writing to
      restricted paths (e.g., /etc/...) may fail; binary data not directly supported unless encoded (e.g.,
      base64) and decoded later on the host.
  functions.run_file:
    tool_name: functions.run_file
    parameters:
    - name: filename
      type: string
      description: Name of a file that has already been uploaded to the build host (via functions.upload_file)
        to execute.
      required: true
    input_format: A single JSON object (per tool schema) containing only a string field 'filename' naming
      the uploaded file to execute; does not accept structured command lines or arrays of arguments.
    output_format: Returns captured stdout and stderr from running the file on the build host; may also
      include execution metadata (commonly an exit code) depending on the harness (exact field names may
      vary).
    restrictions:
    - No other supported parameters beyond 'filename' (no args, env vars, working directory, timeout,
      etc.) exposed via the tool interface.
    - Cannot directly provide command-line arguments.
    - Cannot directly provide environment variables.
    - Cannot directly provide a working directory.
    - Cannot provide a shell command string (use functions.run_ci_command for inline shell commands).
    - Can only execute a file that exists on the build host and is referenced by 'filename' (i.e., previously
      uploaded).
    - Runs inside a controlled CI/build environment (sandbox/container/VM depending on the system).
    - Network, filesystem, runtime, and permissions may be restricted.
    - Execution time and output size may be limited by the CI harness.
    - 'The file usually needs to be executable or invoked in a way the harness supports; some systems
      may require a proper shebang (e.g., #!/usr/bin/env bash or #!/usr/bin/env python3).'
    examples:
    - 'Upload then run a script: {"tool":"functions.upload_file","parameters":{"filename":"hello.sh","content":"#!/usr/bin/env
      bash\necho \"Hello from run_file\"\n"}} سپس {"tool":"functions.run_file","parameters":{"filename":"hello.sh"}}'
    security_notes: Execution occurs on a controlled CI/build host environment; network/filesystem/runtime/permissions
      may be restricted, and execution time/output size may be limited by the CI harness.
  multi_tool_use.parallel:
    tool_name: multi_tool_use.parallel
    parameters:
    - name: tool_uses
      type: array of objects
      description: List of tool invocation objects to run in parallel; each object describes one tool
        call with a recipient_name and parameters.
      required: true
    - name: tool_uses[].recipient_name
      type: string
      description: Target tool name to invoke; must be exactly in the format `functions.<function_name>`
        (only tools in the `functions` namespace are permitted).
      required: true
    - name: tool_uses[].parameters
      type: object
      description: 'JSON object of parameters for the selected `functions.*` tool; must match that underlying
        tool’s schema (e.g., for `functions.get_pr`, `{ "pr_number": 123 }`).'
      required: true
    input_format: 'Only JSON. A single JSON object with shape `{ "tool_uses": [ { "recipient_name": "functions.<tool_name>",
      "parameters": { ... } } ] }`. No FREEFORM input; nested `parameters` must also be JSON and conform
      to the selected tool’s required input shape.'
    output_format: 'A single combined result containing outputs from each requested tool call. Conceptually:
      one top-level response with one entry per tool use (in the same order as `tool_uses`), where each
      entry contains whatever that tool normally returns. Exact keys are tool/framework-defined; practically
      a list of tool results corresponding to the requested calls.'
    restrictions:
    - 'Parallel-only when independent: group only tool calls that can truly run concurrently; if one call
      depends on another’s output, it is not a good fit.'
    - Only `functions.*` tools are allowed; calls are restricted to tools in the `functions` namespace.
    - Each tool call must validate; missing/invalid parameters may cause that call to fail validation/error,
      while other calls may still succeed depending on tool runner behavior.
    - 'No implicit data flow: no built-in piping of outputs from one tool call into another within the
      same parallel call; it is only fan-out and gather results.'
    - Side effects still happen and ordering isn’t guaranteed; avoid mixing actions where ordering matters
      (e.g., merge and post comment in parallel).
    examples:
    - "{\n  \"tool_uses\": [\n    {\n      \"recipient_name\": \"functions.get_pr\",\n      \"parameters\"\
      : { \"pr_number\": 123 }\n    },\n    {\n      \"recipient_name\": \"functions.list_pull_requests\"\
      ,\n      \"parameters\": { \"repo\": \"\", \"status\": \"open\" }\n    }\n  ]\n}"
    - "{\n  \"tool_uses\": [\n    {\n      \"recipient_name\": \"functions.run_ci_command\",\n      \"\
      parameters\": { \"command\": \"pytest -q\", \"pr_number\": 123 }\n    },\n    {\n      \"recipient_name\"\
      : \"functions.run_ci_command\",\n      \"parameters\": { \"command\": \"npm test\", \"pr_number\"\
      : 123 }\n    }\n  ]\n}"
    security_notes: 'Access control noted: only tools in the `functions` namespace are permitted. Side
      effects can occur for each invoked tool and ordering is not guaranteed when run in parallel.'
