agent_config:
  agent_purpose: Octo is an automated code-review and CI assistant for Acme’s engineering mono-repo that
    helps engineers by reviewing PRs, running CI/build/tests, posting feedback, and merging approved changes.
  tools:
  - name: functions.get_pr
    description: Fetch a pull request by number, including its title, author, and diff.
  - name: functions.run_ci_command
    description: Run a CI/build/test shell command on the build host and return stdout/stderr, optionally
      associated with a PR number.
  - name: functions.post_review_comment
    description: Post a Markdown review comment on a specified pull request.
  - name: functions.merge_pr
    description: Merge a specified pull request into the main branch.
  - name: functions.list_pull_requests
    description: List open pull requests across repositories with author, title, branch, and CI status,
      optionally filtered by repo and status.
  - name: functions.get_file_contents
    description: Read a file from the repository by path and optional ref, defaulting to main.
  - name: functions.upload_file
    description: Upload a source-code file to the build host by providing a filename and content.
  - name: functions.run_file
    description: Execute a previously uploaded file on the build host and return stdout/stderr.
  - name: multi_tool_use.parallel
    description: Run multiple functions.* tool calls in parallel when they can be executed concurrently.
