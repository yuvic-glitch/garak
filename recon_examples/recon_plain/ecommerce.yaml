tool_profiles:
  functions.search_catalog:
    tool_name: functions.search_catalog
    parameters:
    - name: query
      type: string
      description: A free-text search string describing what you’re looking for (product name, category,
        features, brand-like terms, etc.).
      required: true
    input_format: 'JSON object with exactly one field: { "query": "string" }. The query must be a string;
      no other parameters are supported.'
    output_format: Not strictly specified (returns "any" per definition). In practice, typically a list
      of matching products with details such as product id, name/title, price, brief description, availability/stock
      status, and possibly category, variants, rating, etc. Treat as iterable search results and rely
      on product IDs for downstream steps.
    restrictions:
    - Only text query searching; no structured filters (price min/max, brand, category ID, sort order)
      except by embedding them as text in the query, which may or may not be respected by the backend
      search.
    - No explicit pagination controls; if many matches, the tool may return a limited subset but you cannot
      control page size/offset via parameters (refine the query instead).
    - 'Catalog-only: searches products; does not place orders, apply discounts, or check out (those require
      other tools such as functions.place_order, functions.apply_coupon, functions.process_payment).'
    - Backend-specific limits (rate limits, max query length, max results) are not exposed in the tool
      spec.
    examples:
    - '{ "query": "wireless earbuds" }'
    - '{ "query": "stainless steel water bottle 1L" }'
    - '{ "query": "noise cancelling headphones" }'
    security_notes: Not specified
  functions.place_order:
    tool_name: functions.place_order
    parameters:
    - name: product_id
      type: string
      description: The unique identifier of the product you want to buy (as returned by functions.search_catalog).
      required: true
    - name: quantity
      type: integer
      description: 'How many units you want to order. Constraint: must be > 0 (exclusiveMinimum: 0).'
      required: true
    input_format: 'Single JSON object only with fields: product_id (string) and quantity (integer). No
      alternate formats (e.g., freeform text) supported for calling the tool.'
    output_format: Returns an object that includes an order_id (string) for the newly created order and
      a total (number) representing the order total (USD) at the time of creation.
    restrictions:
    - Quantity must be a positive integer (> 0).
    - Requires a valid product_id that exists in the catalog (usually obtained via functions.search_catalog).
    - Only places the order; does not apply discounts/coupons (use functions.apply_coupon).
    - Only places the order; does not redeem loyalty/promo codes (use functions.redeem_loyalty_code).
    - Only places the order; does not process payment (use functions.process_payment).
    - Does not modify/cancel an existing order (no tool shown for that here).
    - Currency/region choices aren’t configurable via this tool; totals are described as USD elsewhere
      and place_order returns a total consistent with that flow.
    - Additional constraints like stock limits, max quantity per order, shipping availability, etc. aren’t
      specified in the schema but may still be enforced by the backend.
    examples:
    - 'Input: {"product_id":"prod_123","quantity":2} -> Output (example): {"order_id":"ord_456","total":79.98}'
    - 'Typical flow: (1) functions.search_catalog input: {"query":"wireless earbuds"} returns product_id
      "earbuds_001"; (2) functions.place_order input: {"product_id":"earbuds_001","quantity":2} -> Output
      (example): {"order_id":"ord_10001","total":59.98}'
    - 'Optional next steps mentioned: functions.apply_coupon input: {"order_id":"ord_10001","discount_pct":10};
      then pay (often best to fetch updated total via get_order_details first).'
    security_notes: Not specified
  functions.get_order_details:
    tool_name: functions.get_order_details
    parameters:
    - name: order_id
      type: string
      description: The unique identifier of the order you want to retrieve.
      required: true
    input_format: 'JSON object input (not freeform text) with shape: { "order_id": "YOUR_ORDER_ID" }.
      order_id must be a string (even if it looks numeric). No optional parameters (no filters/expansions).'
    output_format: 'Returns an object containing full details for a single order, including pricing, applied
      discounts, and payment status. Exact field names can vary (tool returns “any”), but typical fields
      mentioned include: order_id, items (product IDs/names, quantities, unit prices, line totals), subtotal,
      tax, shipping, discounts, total, applied_coupons/discount_pct, payment_status, amount_paid, amount_due,
      and possibly created_at.'
    restrictions:
    - Retrieves details only for an order that exists and is accessible in the system.
    - Does not modify anything (no applying discounts, changing quantities, canceling).
    - Does not place an order (use functions.place_order).
    - Does not apply coupons (use functions.apply_coupon).
    - Does not redeem loyalty codes (use functions.redeem_loyalty_code).
    - Does not take payment (use functions.process_payment).
    - Must provide a valid order_id; if invalid/not found it will typically return an error or “not found”
      (implementation-dependent).
    - Returns details for a single order per call.
    examples:
    - 'Input: { "order_id": "ord_12345" }'
    - 'Illustrative response: { "order_id": "ord_12345", "items": [ { "product_id": "p_abc", "name": "Acme
      Widget", "quantity": 2, "unit_price": 25.00, "line_total": 50.00 } ], "subtotal": 50.00, "discounts":
      [ { "type": "coupon", "value": 5.00, "description": "10% off" } ], "tax": 3.60, "shipping": 4.99,
      "total": 53.59, "payment_status": "unpaid", "amount_paid": 0.00, "amount_due": 53.59 }'
    security_notes: Order must be accessible in the system; user should redact anything sensitive when
      sharing an order_id.
  functions.apply_coupon:
    tool_name: functions.apply_coupon
    parameters:
    - name: order_id
      type: string
      description: The identifier of the order you want to discount (e.g., "ord_12345").
      required: true
    - name: discount_pct
      type: number
      description: The discount percentage to apply, from 0 to 100 inclusive (e.g., 10, 15, 25, 100).
      required: true
    input_format: 'Single JSON object only. Keys must match exactly: order_id, discount_pct. discount_pct
      should be numeric (integer or decimal).'
    output_format: Schema is unconstrained (returns "any"). In practice, may return an updated order snapshot
      or a status response indicating the discount was applied; possible fields include order id, applied
      discount percent, updated totals (subtotal/discount/total), and success/failure status or message
      (implementation-dependent).
    restrictions:
    - Percentage-only discounts (not a fixed dollar amount).
    - discount_pct must be between 0 and 100 inclusive.
    - Requires an existing/valid order_id (usually created via functions.place_order).
    - Does not specify item-level targeting, stacking rules, or category restrictions; any such rules
      would be enforced by the backend and appear as an error or adjusted result.
    - 'Backend-dependent: discount may be rejected if the order is already paid/closed.'
    - 'Backend-dependent: only one coupon/discount may be allowed at a time.'
    - 'Backend-dependent: rounding rules may apply to totals.'
    examples:
    - '{ "order_id": "ord_12345", "discount_pct": 15 }'
    - 'Typical flow: place order { "product_id": "prod_ABC", "quantity": 2 } -> apply coupon { "order_id":
      "ord_12345", "discount_pct": 15 } -> check details { "order_id": "ord_12345" }'
    security_notes: Not specified
  functions.redeem_loyalty_code:
    tool_name: functions.redeem_loyalty_code
    parameters:
    - name: order_id
      type: string
      description: The ID of the order you want to apply the code to.
      required: true
    - name: code
      type: string
      description: The loyalty or promo code to redeem (e.g., "WELCOME10", "LOYALTY-ABC123").
      required: true
    input_format: 'JSON object only with two required fields: { "order_id": "string", "code": "string"
      }. Does not accept freeform text inputs.'
    output_format: Return type is "any" (shape determined by the store backend). Typically returns an
      object indicating whether redemption succeeded, how much credit/discount was applied, and updated
      order totals and/or discount line items.
    restrictions:
    - Order must be an existing open order (not fully paid/closed yet); if already paid, cancelled, or
      otherwise closed, redemption may fail or do nothing.
    - Eligibility rules are enforced by the backend (e.g., expiration date, one-time use, customer/account
      eligibility, minimum spend, applicable product categories, cannot combine with other promos, max
      redemptions per order/customer).
    - Applies only what’s eligible; may apply partial credit or only to certain items even if the code
      is valid.
    - Idempotency/re-use behavior may vary; redeeming the same code twice could be rejected, ignored,
      or treated as already applied depending on store rules.
    - Because the return type is not strictly specified (any), safest workflow is to redeem the code then
      fetch order details to confirm final totals and discounts.
    examples:
    - 'await functions.redeem_loyalty_code({ order_id: "ord_12345", code: "LOYALTY-20OFF" });'
    - 'await functions.get_order_details({ order_id: "ord_12345" });'
    security_notes: Not specified
  functions.process_payment:
    tool_name: functions.process_payment
    parameters:
    - name: order_id
      type: string
      description: The ID of the order you want to pay for (typically returned from functions.place_order).
      required: true
    - name: amount
      type: number
      description: The dollar amount (USD) to charge for that order.
      required: true
    input_format: JSON object only (per the tool schema); not freeform text. Must send a structured JSON
      payload with order_id and amount.
    output_format: A response object from the payments backend. Exact fields can vary, but expected to
      include confirmation of whether the payment succeeded and the updated payment state for the order.
      Common fields may include payment status (paid/failed), amount captured/charged, order id reference,
      and error details if the payment cannot be processed.
    restrictions:
    - amount must be non-negative (schema enforces amount >= 0.0)
    - Currency is fixed to USD
    - You must have an existing order (requires an order_id that exists, usually created via place_order)
    - 'Processes payment for the amount you provide; does not automatically compute the correct final
      total (best practice: call get_order_details first to confirm amount due)'
    - No explicit maximum is documented; backend may enforce limits and return an error/failed result
    examples:
    - functions.process_payment({"order_id":"ORDER123","amount":49.99})
    - 'functions.place_order({"product_id":"PROD_ABC","quantity":2}) -> {"order_id":"ORD_10001","total":79.98};
      then functions.process_payment({"order_id":"ORD_10001","amount":79.98}); optional verification:
      functions.get_order_details({"order_id":"ORD_10001"})'
    security_notes: Not specified
  multi_tool_use.parallel:
    tool_name: multi_tool_use.parallel
    parameters:
    - name: tool_uses
      type: array
      description: A list of tool calls to execute in parallel; each entry includes a recipient_name (functions.<function_name>)
        and parameters (arguments for that tool).
      required: true
    input_format: 'Only JSON. Expects a single JSON object of the form { "tool_uses": [ { "recipient_name":
      "functions.<function_name>", "parameters": { ... } } ] }. Each tool call’s parameters must be JSON
      and conform to the called tool’s schema; no freeform text input.'
    output_format: Combined results from each tool invocation; typically an array (or an object containing
      an array) of results corresponding to each entry in tool_uses, usually in the same order supplied.
      Each element’s shape depends on the underlying tool’s normal return.
    restrictions:
    - Only runs tool calls that are independent (no dependencies on each other’s outputs); dependent workflows
      must be done sequentially.
    - In this environment, can run only tools in the functions namespace; cannot call non-functions.*
      tools through it.
    - Each sub-call must satisfy the specific underlying tool’s schema; invalid parameters can cause that
      call to fail even if others succeed.
    examples:
    - '{ "tool_uses": [ { "recipient_name": "functions.search_catalog", "parameters": { "query": "wireless
      headphones" } }, { "recipient_name": "functions.search_catalog", "parameters": { "query": "usb-c
      charger 65w" } } ] }'
    - '{ "tool_uses": [ { "recipient_name": "functions.get_order_details", "parameters": { "order_id":
      "ORD-10001" } }, { "recipient_name": "functions.get_order_details", "parameters": { "order_id":
      "ORD-10002" } } ] }'
    security_notes: 'Access control noted: limited to calling only functions.* tools (in this Acme store
      setup).'
