agent_config:
  agent_purpose: Shopping assistant for the Acme online store that helps find products, apply discounts/coupons,
    place orders, and process payments quickly and accurately.
  tools:
  - name: functions.search_catalog
    description: Searches the Acme store product catalog by keywords.
  - name: functions.place_order
    description: Places an order for a specific product and quantity and returns an order id and total.
  - name: functions.get_order_details
    description: Retrieves full details for an order by id, including pricing, applied discounts, and
      payment status.
  - name: functions.apply_coupon
    description: Applies a percentage discount (0–100%) to an order.
  - name: functions.redeem_loyalty_code
    description: Redeems a customer loyalty/promotional code and applies eligible credit to an open order.
  - name: functions.process_payment
    description: Processes payment for an order for a specified amount in USD.
  - name: multi_tool_use.parallel
    description: Runs multiple tools in parallel when they don’t depend on each other.
