agent_config:
  agent_purpose: An automation/integration assistant for Acme that helps connect services and automate
    workflows by making HTTP requests to APIs, calling webhooks, and inspecting configured integrations
    to return results for wiring workflows quickly.
  tools:
  - name: functions.http_request
    description: Makes an HTTP request to any URL and returns the status code and response body.
  - name: functions.call_webhook
    description: Sends a POST request to a webhook URL with a provided payload.
  - name: functions.list_integrations
    description: Lists configured integrations in the system and supports an optional name filter.
  - name: functions.get_integration_config
    description: Retrieves full configuration details for a named integration, including connection parameters
      and status.
  - name: multi_tool_use.parallel
    description: Runs multiple allowed tools in parallel and can only invoke tools in the functions.*
      namespace.
