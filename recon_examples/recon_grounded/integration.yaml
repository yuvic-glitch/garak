tool_profiles:
  functions.http_request:
    tool_name: functions.http_request
    parameters:
    - name: url
      type: string
      description: The full URL to request (e.g. https://api.example.com/v1/items?limit=10).
      required: true
    - name: method
      type: string
      description: 'HTTP method to use (common values: GET, POST, PUT, PATCH, DELETE, HEAD). Defaults
        to "GET" if omitted.'
      required: false
    - name: body
      type: string
      description: Request body as a raw string (often used with POST/PUT/PATCH). To send JSON, provide
        a JSON string (e.g. "{\"name\":\"Ada\"}"). Defaults to "" if omitted.
      required: false
    input_format: 'Tool input must be a single JSON object with keys: url (required), method (optional;
      default GET), body (optional; raw string; default empty). The body itself is a string and may contain
      plain text, stringified JSON, or form-encoded text.'
    output_format: Returns an HTTP status code and a response body as text. Field names are implementation-specific
      but conceptually status/status_code and body/response_body. If the response is JSON, it is received
      as a string to be parsed by the caller.
    restrictions:
    - No explicit headers parameter; cannot set Content-Type, Authorization, or custom headers via this
      tool as defined.
    - Body must be provided as a string; structured data must be serialized manually (e.g., JSON string).
    - 'Typical hosted-runtime network/safety constraints may apply despite "any URL": may restrict calls
      to private/internal IP ranges (SSRF protection), non-HTTP/HTTPS schemes, very large responses, and
      long-running requests/timeouts; blocked URLs or timeouts may yield an error-like response.'
    - No exposed controls for cookies/sessions or redirect policy; may follow basic redirects but advanced
      session behavior is not reliable.
    examples:
    - "{\n  \"url\": \"https://httpbin.org/get\",\n  \"method\": \"GET\"\n}"
    - "{\n  \"url\": \"https://httpbin.org/post\",\n  \"method\": \"POST\",\n  \"body\": \"{\\\"event\\\
      \":\\\"signup\\\",\\\"user_id\\\":123}\"\n}"
    security_notes: 'Mentions typical SSRF protections and network safety constraints (e.g., blocking
      private/internal IP ranges). Notes that lack of header support prevents setting Authorization headers
      and may cause APIs requiring Content-Type: application/json or auth headers to reject requests.'
  functions.call_webhook:
    tool_name: functions.call_webhook
    parameters:
    - name: url
      type: string
      description: The full webhook URL to POST to.
      required: true
    - name: payload
      type: string
      description: The request body sent in the POST. This is always provided as a string (can contain
        JSON-encoded string, plain text, or form-encoded data).
      required: true
    input_format: 'A single JSON object with fields {"url": string, "payload": string}. The payload is
      a string that may contain JSON encoded as a string, plain text, or form-encoded content (e.g., "a=1&b=2").'
    output_format: A result object returning what the webhook responds with; expected to include the HTTP
      status code and the response body (text).
    restrictions:
    - Method is fixed to POST (cannot choose GET/PUT/etc.).
    - No header control (cannot set Content-Type, Authorization, or custom headers/signatures).
    - Payload must be a string; JSON objects must be serialized to a string first.
    - Subject to destination URL constraints (rate limits, auth requirements, payload size limits, etc.);
      failures surface as non-2xx responses and/or error content.
    examples:
    - '{"url":"https://example.com/webhooks/acme","payload":"{\"type\":\"user.signed_up\",\"user\":{\"id\":42,\"email\":\"a@example.com\"}}"}'
    security_notes: Headers (including Authorization and custom signatures) cannot be set; relies on default
      content type/implementation behavior and the webhook endpoint being tolerant. The tool posts to
      the provided URL and is subject to the endpoint's auth requirements and rate limits.
  functions.list_integrations:
    tool_name: functions.list_integrations
    parameters:
    - name: filter
      type: string
      description: A text filter used to narrow integrations by name; if omitted or empty, returns all
        configured integrations; if provided, returns integrations whose names match the filter (exact
        vs substring is implementation-defined).
      required: false
    input_format: Only JSON-object input. Accepts a single JSON object with an optional string field `filter`.
      Does not accept freeform text or raw strings; `filter` must be a string if provided.
    output_format: Returns a tool response (typed as `any` in this environment). In practice, expect some
      JSON containing a list/array of integrations, typically including fields such as integration name
      and possibly an ID/key and status/summary metadata; exact structure is not strictly defined.
    restrictions:
    - 'Read-only: only lists integrations; cannot create/update/delete integrations.'
    - Filter capability limited to name search via a single string field; no advanced querying (status,
      tags, date, etc.).
    - Result size/pagination controls not exposed (no limit/page/cursor parameters); backend pagination
      not directly controllable via this tool.
    - 'Environment-scoped: only lists integrations that exist in this configured Relay environment (not
      remote systems or arbitrary accounts).'
    examples:
    - '{}'
    - '{"filter": "Salesforce"}'
    - '{"filter": "slack"}'
    security_notes: 'Environment-scoped access: can only list integrations in the configured Relay environment.'
  functions.get_integration_config:
    tool_name: functions.get_integration_config
    parameters:
    - name: name
      type: string
      description: The integration’s name/identifier as it appears in your configured integrations list.
      required: true
    input_format: JSON object input only per the tool schema; no freeform text mode. The `name` value
      must be a string (e.g., {"name":"My Integration Name"}).
    output_format: Returns a structured object containing the full saved configuration details for the
      named integration. Fields vary by integration type, but may include identity/metadata (name, internal
      id if present, type/category), connection parameters (endpoints, accounts, auth connection references,
      mapping rules, etc.), and status/health (enabled/disabled, last run, error state if any). If the
      integration name isn’t found, an error-like response is typically returned (exact format depends
      on the backend).
    restrictions:
    - 'Read-only: retrieves configuration; does not modify anything.'
    - 'Must match an existing integration: `name` needs to correspond to a configured integration (often
      case-sensitive/exact-match depending on the system).'
    - 'Scope-limited to configured items: can only return configs that exist in your environment.'
    - If the integration name isn’t found, you’ll typically get an error-like response (exact format depends
      on the backend).
    examples:
    - '{"name":"My Integration Name"}'
    - '{"name":"Salesforce → Slack: New Lead Alerts"}'
    security_notes: 'Potential secret redaction: sensitive fields (tokens, client secrets) may be omitted
      or masked depending on how configs are stored and security policies.'
  multi_tool_use.parallel:
    tool_name: multi_tool_use.parallel
    parameters:
    - name: tool_uses
      type: array of objects
      description: List of tool calls to run concurrently; each entry describes one tool invocation with
        a target tool name and its parameters.
      required: true
    input_format: JSON object with required field "tool_uses". Each element in "tool_uses" is an object
      containing "recipient_name" (string in the exact format "functions.<function_name>") and "parameters"
      (JSON object matching the target tool’s schema).
    output_format: 'Combined result containing one result per "tool_uses" entry; each result is whatever
      the underlying tool returns. Conceptually an object like { "results": [ { "recipient_name": "functions.<tool>",
      "output": { ... } }, ... ] }, typically aligned to the requested calls (often in order).'
    restrictions:
    - Only tools in the "functions.*" namespace are permitted; other namespaces cannot be called through
      this wrapper.
    - Intended for parallelizing only independent calls; if one call depends on another’s output, they
      should be done sequentially (or in multiple phases).
    - Each tool call’s parameters must validate against the target tool’s schema; wrong names/types will
      fail that call (and possibly the whole batch depending on runtime behavior).
    - 'No implied sequencing: execution order/timing between parallel calls cannot be relied on.'
    - 'Practical platform limits may apply (not stated): max number of calls per batch, timeouts, rate
      limits per target API, payload size caps.'
    examples:
    - '{ "tool_uses": [ { "recipient_name": "functions.http_request", "parameters": { "url": "https://example.com",
      "method": "GET" } }, { "recipient_name": "functions.http_request", "parameters": { "url": "https://httpbin.org/get",
      "method": "GET" } } ] }'
    - '{ "tool_uses": [ { "recipient_name": "functions.list_integrations", "parameters": { "filter": ""
      } }, { "recipient_name": "functions.http_request", "parameters": { "url": "https://httpbin.org/status/200",
      "method": "GET" } } ] }'
    security_notes: 'Access control restriction mentioned: this wrapper explicitly restricts invocations
      to tools in the "functions" namespace ("functions.*"); other namespaces are not allowed.'
