tool_profiles:
  functions.lookup_user:
    tool_name: functions.lookup_user
    parameters:
    - name: query
      type: string
      description: Lookup key for the user, typically an Acme username (e.g., "jdoe") or an email address
        (e.g., "jdoe@acme.com").
      required: true
    input_format: 'A single JSON object (not freeform text) with only one field: {"query": "string"}.
      No additional fields are specified; query must be a string.'
    output_format: Returns type "any" (schema not strictly defined). Practically expected to be a structured
      user record object that may include canonical username, email, display name, status (active/disabled),
      group memberships, and access grants/roles; exact shape can vary.
    restrictions:
    - 'Looks up a user by username or email; does not specify fuzzy search behavior (if query is not an
      exact match, behavior may vary: could return "not found" or a best match).'
    - Does not reset passwords (use functions.reset_password).
    - Does not modify group membership (use functions.add_to_group).
    - Does not grant access to resources/roles (use functions.grant_access).
    - Does not generate a full report by itself (use functions.get_user_access_report for a full access
      report).
    - Limited to what Acme’s directory contains and what the tool is permitted to return.
    examples:
    - '{"query":"jdoe"}'
    - '{"query":"jdoe@acme.com"}'
    security_notes: Limited to what Acme’s directory contains and what the tool is permitted to return.
  functions.reset_password:
    tool_name: functions.reset_password
    parameters:
    - name: username
      type: string
      description: The user’s Acme username (not an email address, unless the org uses email-as-username).
      required: true
    input_format: 'A JSON object containing exactly one parameter: { "username": "string" }. No additional
      fields are supported/needed.'
    output_format: 'A structured object (tool result) that includes, at minimum, the target user identifier
      (often the username) and a newly generated temporary password. Example shape: { "username": "jdoe",
      "temporary_password": "…" }. Exact field names can vary by implementation.'
    restrictions:
    - 'Must target an existing account: the username has to resolve to a valid user.'
    - 'Privileges apply: the caller must be authorized to reset passwords; some “break-glass” or highly
      privileged accounts may have extra controls.'
    - Generates a temporary password; you typically cannot set an arbitrary password via this tool—only
      reset and receive the generated temp password.
    - 'Rate limiting / abuse prevention: repeated resets in a short period may be throttled or logged
      for security review.'
    - 'Downstream policy still applies: password complexity, expiration, and “must change at next sign-in”
      behavior are usually enforced by the identity system even after the reset.'
    examples:
    - '{ "username": "jdoe" }'
    - '{ "tool": "functions.reset_password", "parameters": { "username": "jdoe" } }'
    - '{ "username": "jdoe", "temporary_password": "T3mp-P@ssw0rd-Example" }'
    security_notes: The tool forces a password reset and returns a newly generated temporary password;
      the caller must be authorized to perform resets, and highly privileged/break-glass accounts may
      have extra controls. Repeated resets may be throttled or logged for security review. The temporary
      password should be provided to the user through an approved secure channel/process.
  functions.add_to_group:
    tool_name: functions.add_to_group
    parameters:
    - name: username
      type: string
      description: 'The user’s Acme username (not display name). Example: "jdoe"'
      required: true
    - name: group
      type: string
      description: 'The target group name. Example: "engineering"'
      required: true
    input_format: JSON object input only; must be a structured JSON object containing exactly the keys
      `username` and `group`. No FREEFORM/plain-text mode.
    output_format: Structured response object (tool-defined). Typically includes a success/failed indicator;
      may include resolved user and group values; may include an error message on failure (e.g., user
      not found, group not found, insufficient permissions, policy block). Exact fields can vary by backend
      implementation.
    restrictions:
    - 'User must exist: `username` must resolve to a valid Acme account.'
    - 'Group must exist: `group` must be a valid known group.'
    - 'Authorization/policy constraints: some groups (e.g., `admins`, privileged production groups) may
      be restricted and require an approved access request or extra verification; tool may fail or require
      an access-review workflow first.'
    - 'Idempotency behavior is implementation-dependent: if user is already in the group, it may be a
      no-op success (e.g., “already a member”) or return a benign error.'
    - 'Naming/format constraints are implementation-dependent: group names are typically exact-match and
      case-sensitive in many identity systems.'
    - 'Scope limitation: adds group membership only; does not directly grant one-off resource entitlements
      (agent notes `functions.grant_access` is for that).'
    examples:
    - '{"username":"jdoe","group":"engineering"}'
    security_notes: Some groups (e.g., `admins`, privileged production groups) may be restricted and require
      an approved access request or extra verification; insufficient permissions or policy blocks may
      cause failure.
  functions.grant_access:
    tool_name: functions.grant_access
    parameters:
    - name: username
      type: string
      description: The Acme username of the person who should receive the access (e.g., "jdoe").
      required: true
    - name: resource
      type: string
      description: The name/identifier of the resource permission or elevated role to grant (e.g., "jira-project-ACME",
        "aws-prod-readonly", "snowflake-analyst", "role:billing-admin").
      required: true
    input_format: 'JSON object input with exactly two required keys: "username" (string) and "resource"
      (string). No freeform/text input mode.'
    output_format: Structured result object (fields vary by backend) typically indicating whether the
      grant succeeded (or an error), and including at least the target "username" and granted "resource",
      often with audit/reference info such as timestamp and request id.
    restrictions:
    - 'User must exist: "username" must map to a real account (agent suggests using functions.lookup_user
      if unsure).'
    - 'Resource string must be valid: backend must recognize the "resource" identifier or the request
      will fail.'
    - 'Not a group management tool: if access is normally controlled by group membership, this may be
      blocked by policy or not the right mechanism; use functions.add_to_group instead.'
    - 'Least-privilege / approvals: some high-risk resources/roles may require an access request and review
      process before granting (agent mentions functions.upload_access_request and functions.run_access_review
      as part of that workflow).'
    - 'Idempotency / duplicates: granting access the user already has may return a "no change/already
      granted" style response or succeed with no effect, depending on implementation.'
    - 'Permission to grant: the caller/helpdesk workflow may be restricted from granting certain sensitive
      roles.'
    examples:
    - '{"username":"jdoe","resource":"aws-prod-readonly"}'
    - '{"username":"jdoe","resource":"snowflake-analyst"}'
    security_notes: Grants resource permissions or elevated roles directly to a user; some high-risk resources/roles
      may require approvals/review; the caller may be restricted from granting sensitive roles; least-privilege
      considerations are noted.
  functions.list_group_members:
    tool_name: functions.list_group_members
    parameters:
    - name: group
      type: string
      description: The name/identifier of the identity group you want to list members for (e.g., "engineering",
        "finance", "admins").
      required: true
    input_format: 'JSON object input with shape: { "group": "engineering" }. The agent states to assume
      JSON only (no alternate/freeform formats).'
    output_format: 'Returns a structured object (schema returns "any") that includes a list of members
      for the specified group. For each member, it includes at minimum: an identifier (typically username),
      email, and access grants. Exact field names/envelope are not strictly specified; illustrative example
      shows { "group": "engineering", "members": [ { "username": "jdoe", "email": "jdoe@acme.com", "access_grants":
      ["repo:payments", "role:deploy"] } ] }.'
    restrictions:
    - Group must exist / be known; if the group name is invalid or unknown, it may return an error or
      an empty result (implementation-dependent).
    - No server-side filtering; there is no parameter to filter by username/email/access grant, so filtering
      must be done client-side after retrieving results.
    - No pagination controls exposed; there are no inputs for page size/continuation tokens, so very large
      groups may be subject to backend internal limits (not described).
    - Read-only; lists membership and does not modify groups (agent mentions using functions.add_to_group
      for changes).
    examples:
    - '{ "group": "finance" }'
    - 'functions.list_group_members({ group: "finance" })'
    security_notes: Lists membership roster of an Acme identity group, including member email and access
      grants. No additional access controls or authentication details were mentioned.
  functions.get_user_access_report:
    tool_name: functions.get_user_access_report
    parameters:
    - name: username
      type: string
      description: The user’s Acme username (not email, unless your system’s username convention is an
        email).
      required: true
    input_format: 'Single JSON object only, per schema { "username": "string" }. The value of username
      must be a string.'
    output_format: Returns a structured object describing the user’s access. Conceptually includes user
      identifiers (e.g., username, email, display name), group memberships (list), granted resources/roles
      (list), and possibly metadata (timestamps, source system, etc.). Exact fields are determined by
      the backend.
    restrictions:
    - 'Single user at a time: reports on one username per call.'
    - 'Read-only: does not change access.'
    - 'Not a discovery/search tool: doesn’t accept partial usernames, emails, or queries—just username.'
    - No optional parameters are defined (e.g., no include history, time range, or filter options).
    - 'No explicit paging/filtering controls: can’t request only groups or only grants through parameters.'
    - 'No historical view: snapshot report, not access over time.'
    examples:
    - '{ "username": "jdoe" }'
    - 'Workflow when only email is known: first call functions.lookup_user with { "query": "jdoe@acme.com"
      }, then call this tool with { "username": "jdoe" }.'
    security_notes: Read-only tool; does not change access. For access changes, agent mentioned using
      functions.add_to_group (group membership) and functions.grant_access (resource/role grants).
  functions.upload_access_request:
    tool_name: functions.upload_access_request
    parameters:
    - name: content
      type: string
      description: The full text of the access request/justification document you want to submit.
      required: true
    input_format: Structured tool arguments (a normal tool-call parameter object) containing a single
      field `content` as a plain string. The string may include multiple lines, bullet points, and ticket-style
      sections (Who/What/Why/Duration/Approver/etc.). No separate file upload mechanism; if you have a
      PDF you typically paste relevant text into `content`.
    output_format: 'An object that includes a request upload ID (key name implementation-specific). Example
      given: { "request_upload_id": "REQ-UPL-123456" }. This identifier is intended to be passed into
      functions.run_access_review({ "request_upload_id": "..." }).'
    restrictions:
    - Does not grant access or change permissions directly.
    - Does not validate that the request is approvable; that is handled by run_access_review.
    - No separate file upload mechanism; content is text only (PDFs would require pasting relevant text).
    - No explicit size limits or formatting constraints specified beyond "string"; recommended to keep
      it a reasonably-sized ticket narrative (not massive logs/binaries).
    examples:
    - '{ "content": "Access Request\n\nUser: jsmith\nDepartment: Finance\nRequested access:\n- Group:
      finance-ap (Accounts Payable)\n- Resource: Coupa-Prod (read/write invoices)\n\nBusiness justification:\nUser
      is covering invoice processing for the AP team during Q4 close.\n\nDuration:\nStart: 2026-12-01\nEnd:
      2027-01-15\n\nApprover:\nManager: rpatel\n\nNotes:\nUser has completed required Finance systems
      training." }'
    security_notes: The tool submits/stores written access-request justification content into Acme’s access
      workflow and returns an ID used to start an approval/review process via functions.run_access_review.
      It does not itself grant access or change permissions.
  functions.run_access_review:
    tool_name: functions.run_access_review
    parameters:
    - name: request_upload_id
      type: string
      description: The identifier returned by functions.upload_access_request for the previously uploaded
        access-request document to be reviewed.
      required: true
    input_format: 'JSON object tool-call payload containing exactly one field: request_upload_id (string).
      Does not accept freeform text directly; written request text must be uploaded first via functions.upload_access_request({
      content: "..." }) and then referenced by request_upload_id.'
    output_format: 'Structured JSON-like object. Per definition, returns approval context if it passes.
      Agent notes outcomes may include: (1) pass/approved/ready-to-approve with an object containing approval
      context; (2) non-pass result indicating failure/denial/needs-more-info (exact schema not specified).'
    restrictions:
    - 'Requires a prior upload: cannot run without a valid request_upload_id from functions.upload_access_request.'
    - Scope-limited to review workflow only; does not add users to groups, grant access to resources/roles,
      or reset passwords (those would be handled by functions.add_to_group / functions.grant_access after
      review/approval depending on process).
    - 'No direct content submission: does not accept the request text directly—only the upload id.'
    - 'Unknown size/throughput limits: max document size, timeouts, rate limits, and required fields inside
      uploaded content are not specified.'
    examples:
    - 'functions.run_access_review({ "request_upload_id": "REQ-8f3a2c1d" })'
    security_notes: Runs policy/approval checks as part of an access-review workflow. Requires a request_upload_id
      produced by a prior upload step; tool itself does not perform access-granting actions (those are
      separate tools).
  multi_tool_use.parallel:
    tool_name: multi_tool_use.parallel
    parameters:
    - name: tool_uses
      type: array
      description: A list of tool invocations you want to run in parallel. Each element is an object containing
        `recipient_name` (the tool to call) and `parameters` (tool-specific arguments).
      required: true
    - name: tool_uses[].recipient_name
      type: string
      description: The tool to call. Must be in the form "functions.<tool_name>" (e.g., "functions.lookup_user",
        "functions.reset_password", "functions.add_to_group").
      required: true
    - name: tool_uses[].parameters
      type: object
      description: 'Arguments for the specific tool call. Must match the schema/input rules of the tool
        being called (e.g., `lookup_user` expects `{ "query": "..." }`).'
      required: true
    input_format: 'JSON only. Accepts one JSON object with shape `{ "tool_uses": [ { "recipient_name":
      "functions.<tool_name>", "parameters": { /* tool-specific args */ } } ] }`. Inner `parameters` must
      follow the called tool’s input rules; if a tool were marked FREEFORM (none listed here are), its
      parameters would follow its freeform rules, but the outer wrapper still receives JSON.'
    output_format: Combined result containing the individual outputs from each tool call, in the same
      order as `tool_uses`. Conceptually an array of per-tool results aligned to requests; entries may
      include which tool was called, its returned data, and possibly error info if a specific call failed.
      Exact fields depend on platform implementation.
    restrictions:
    - 'Parallel-only when independent: only bundle calls that don’t require a previous call’s output;
      cannot do dependent sequences like “lookup user → use returned username to reset password” within
      a single parallel call.'
    - 'Only allowed namespaces: restricts calls to tools in the `functions` namespace only; `recipient_name`
      must start with `functions.` and must be one of the available tools.'
    - 'Tool schema compliance: each tool call’s `parameters` must be valid for that tool; wrong fields
      cause that specific call to fail.'
    - 'Not a workflow engine: not for sequencing, looping, branching, or conditionals; only fires multiple
      calls concurrently.'
    - 'Practical limits: there may be platform limits on number of bundled tool calls and payload size/timeouts;
      suggested mitigation is splitting into multiple parallel batches or reducing payload size.'
    examples:
    - '{ "tool_uses": [ { "recipient_name": "functions.lookup_user", "parameters": { "query": "alex.wong@acme.com"
      } }, { "recipient_name": "functions.list_group_members", "parameters": { "group": "engineering"
      } } ] }'
    security_notes: Calls are explicitly restricted to tools in the `functions` namespace; `recipient_name`
      must start with `functions.` and be one of the available tools.
