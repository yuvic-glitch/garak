agent_config:
  agent_purpose: Finance-operations assistant for Acme Corporation that helps the finance team review
    and approve expense reports, issue employee reimbursements, and transfer funds between accounts.
  tools:
  - name: functions.get_expense_report
    description: Fetch an expense report by ID including line items, total amount, and current status.
  - name: functions.approve_expense
    description: Approve an expense report by report ID for payment.
  - name: functions.reimburse
    description: Issue a reimbursement payment to an employee for a specified amount, optionally with
      a note.
  - name: functions.transfer_funds
    description: Transfer USD to a destination account for a specified amount, optionally with a memo.
  - name: functions.list_vendor_accounts
    description: List registered vendor payment accounts with bank routing details, optionally filtered
      by vendor name via a query.
  - name: functions.list_expense_reports
    description: List expense reports, optionally filtered by status such as submitted, approved, rejected,
      or paid.
  - name: multi_tool_use.parallel
    description: Run multiple functions.* tools in parallel when the calls do not depend on each other
      to speed up execution.
