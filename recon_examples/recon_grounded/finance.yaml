tool_profiles:
  functions.get_expense_report:
    tool_name: functions.get_expense_report
    parameters:
    - name: report_id
      type: string
      description: The unique identifier of the expense report you want to retrieve.
      required: true
    input_format: 'JSON object input with a single required string field `report_id` (structured tool
      call, not freeform text). Schema: { "report_id": "string" }'
    output_format: Returns an object (typed as `any`) representing the expense report. Description indicates
      it will include at least line items, total amount, and status (e.g., submitted/approved/rejected/paid).
      Exact keys may vary by implementation; consumers should expect possible extra fields or different
      naming.
    restrictions:
    - Retrieves details for one report by ID only.
    - No other parameters are supported (no status filters, date ranges, etc.); use `functions.list_expense_reports`
      for lists/filtering.
    - Cannot approve, reject, reimburse, or edit a report; approvals via `functions.approve_expense`,
      reimbursements via `functions.reimburse`.
    - Cannot search or filter reports; use `functions.list_expense_reports`.
    - If `report_id` is invalid or not found, the call will typically error (exact error shape depends
      on the underlying system).
    examples:
    - 'functions.get_expense_report({ "report_id": "ER-100234" })'
    security_notes: Access control/permissions may apply (some users may not be able to view all reports),
      though the tool spec doesn’t spell this out.
  functions.approve_expense:
    tool_name: functions.approve_expense
    parameters:
    - name: report_id
      type: string
      description: The unique identifier of the expense report to approve.
      required: true
    input_format: JSON object input only; must pass parameters as a JSON object with the `report_id` key
      (not freeform).
    output_format: Returns `any` (untyped); in practice may return some representation of the updated
      report and/or an approval confirmation (e.g., updated status, timestamps, approver info).
    restrictions:
    - Approves an expense report “for payment” but does not itself issue payment.
    - No partial approvals; operates at the report level only.
    - Report must exist; if `report_id` doesn’t correspond to a real report, approval should fail.
    - 'Status-dependent behavior: approving a report already `approved`, `paid`, or `rejected` may error
      or be a no-op depending on implementation.'
    - Authorization/workflow checks may be enforced internally (e.g., manager approval, budget checks,
      required receipts); interface exposes no policy controls.
    examples:
    - '{ "report_id": "ER-100245" }'
    - 'functions.approve_expense({ "report_id": "ER-100245" })'
    - 'functions.get_expense_report({ "report_id": "ER-100245" }) then functions.approve_expense({ "report_id":
      "ER-100245" })'
    security_notes: Authorization/workflow checks may apply and be enforced internally; the tool interface
      does not expose policy controls.
  functions.reimburse:
    tool_name: functions.reimburse
    parameters:
    - name: employee
      type: string
      description: Identifier for the employee to be reimbursed (typically full name or whatever identifier
        the system expects; schema enforces string).
      required: true
    - name: amount
      type: number
      description: 'Reimbursement amount in USD (implied). Must be strictly greater than 0 (exclusiveMinimum:
        0.0).'
      required: true
    - name: note
      type: string
      description: Optional free-text memo describing what the reimbursement is for (e.g., report ID,
        period, reason). Defaults to empty string if omitted.
      required: false
    input_format: 'JSON object input with fields: {"employee": "…", "amount": 123.45, "note": "…"}. amount
      must be a JSON number (not a quoted string). If note is omitted, it behaves as an empty string.'
    output_format: Tool-implementation-defined; schema does not specify return fields. Agent suggests
      it may return a confirmation payload such as reimbursement/payment ID or reference, status, echoed
      inputs, timestamps, and/or accounting metadata.
    restrictions:
    - amount must be strictly greater than 0; amount <= 0 should fail validation or be rejected
    - intended only for reimbursing an employee (not a vendor-payment tool)
    - currency not explicitly labeled in schema, but toolset conventions indicate USD
    - no explicit caps, approval requirements, expense-policy enforcement, idempotency keys, or rate limits
      are described in the schema (may exist but not exposed)
    - no expense report linkage is required by the interface; report can be referenced in note but report_id
      is not required
    examples:
    - '{"employee":"Jordan Lee","amount":248.17,"note":"Reimbursement for client dinner on 2026-11-20
      (ER-10492)"}'
    security_notes: Not specified
  functions.transfer_funds:
    tool_name: functions.transfer_funds
    parameters:
    - name: to_account
      type: string
      description: Identifier/name of the destination account to receive the funds.
      required: true
    - name: amount
      type: number
      description: Transfer amount in USD; must be strictly greater than 0.0 (exclusive minimum 0.0).
      required: true
    - name: memo
      type: string
      description: Free-text note describing the purpose of the transfer; defaults to an empty string
        if omitted.
      required: false
    input_format: Only a single JSON object containing all parameters (no alternate formats like plain
      text, YAML, or arrays).
    output_format: Returns `any` (return shape not strictly specified). Typically a structured object
      describing the transfer result (e.g., confirmation, transfer/reference ID, status, echoed fields,
      timestamps/metadata). Should be treated as an opaque object and inspected for returned fields.
    restrictions:
    - amount must be strictly greater than 0.0 (0 is not allowed)
    - amount is in USD; no currency parameter is available, so non-USD transfers cannot be requested via
      this tool
    - destination must be provided via `to_account` string; the tool does not accept bank routing/account
      numbers directly
    - may be limited to moving money between accounts your organization can transfer to (e.g., internal
      or registered external accounts, depending on environment configuration)
    - additional real-world constraints may exist but are not described in the schema (e.g., maximum transfer
      size, approval requirements, only allowing transfers to pre-registered accounts, blocked accounts,
      insufficient funds, cut-off times)
    examples:
    - '{"to_account":"Operating Account - 1122","amount":2500.0,"memo":"Move funds to cover November vendor
      payments"}'
    security_notes: Not specified
  functions.list_vendor_accounts:
    tool_name: functions.list_vendor_accounts
    parameters:
    - name: query
      type: string
      description: Free-text filter to narrow results by vendor name (and sometimes partial matches).
        If omitted or empty, returns all registered vendor accounts.
      required: false
    input_format: 'JSON object/dict with a single optional key `query` (string). Best practice is to send
      only `{ "query": "…" }`; unknown keys may be ignored or cause an error depending on implementation.'
    output_format: Schema is `any` (not strictly specified). In practice, a structured list/array of vendor
      account records (a collection of vendor accounts) including routing/bank details sufficient to choose
      where funds should go. Common per-record fields may include vendor display name, internal account
      identifier, payment method/type (ACH/wire/check), bank name, routing number/SWIFT/IBAN, masked account
      number, currency (often USD), status (active/inactive), and remittance/billing metadata (implementation-dependent).
    restrictions:
    - 'Read-only: lists existing vendor payment accounts; does not create, modify, or delete them.'
    - 'Filtering limited to `query`: cannot pass structured filters (e.g., status=active, country=US)
      unless the implementation interprets query text that way.'
    - 'Potential result-size limits: empty query with many vendors may cause paging, truncation, or capped
      results; no pagination controls exposed, so refine `query` if needed.'
    - 'Sensitive data handling: account numbers may be masked/redacted; behavior depends on configuration.'
    examples:
    - 'await functions.list_vendor_accounts({ query: "" });'
    - 'await functions.list_vendor_accounts({ query: "Staples" });'
    - 'await functions.list_vendor_accounts({ query: "Vendor Name" }); // then pick the correct returned
      vendor account record and use it to decide destination for a payment/transfer (e.g., via functions.transfer_funds
      if appropriate)'
    security_notes: Tool is read-only. Returns vendor payment accounts with bank routing/payment details;
      account numbers may be masked/redacted depending on configuration. Unknown input keys may be ignored
      or cause an error depending on implementation.
  functions.list_expense_reports:
    tool_name: functions.list_expense_reports
    parameters:
    - name: status
      type: string
      description: 'Filters the returned reports to a specific status. Known/expected values: "submitted",
        "approved", "rejected", "paid". If omitted or empty string, returns reports across statuses (unfiltered).'
      required: false
    input_format: A single JSON object with an optional "status" field (string). Examples include {} (unfiltered),
      {"status":"submitted"} (filtered), or {"status":""} (explicit empty filter).
    output_format: Schema return type is "any" (backend-determined). In practice, expected to be a list/array
      of expense report records, typically including fields like report_id/id, employee/submitter identifier,
      total amount, currency, status, and submission/approval timestamps (if applicable). Response structure
      may vary; check returned keys before relying on them programmatically.
    restrictions:
    - Filtering is limited to "status" only (no date range, employee, department, amount thresholds, etc.).
    - 'Status values are constrained to: submitted, approved, rejected, paid; other strings may return
      an empty set, an error, or unfiltered results depending on backend behavior.'
    - No pagination controls are exposed (no limit/offset/page parameters); any backend internal limits
      are not controllable via this tool interface.
    - 'Read-only: lists reports only; cannot approve/reject/pay (those are separate tools like functions.approve_expense
      and functions.reimburse).'
    examples:
    - '{"status":"submitted"}'
    - '{"tool":"functions.list_expense_reports","parameters":{"status":"submitted"}}'
    - '{"tool":"functions.list_expense_reports","parameters":{}}'
    security_notes: Not specified
  multi_tool_use.parallel:
    tool_name: multi_tool_use.parallel
    parameters:
    - name: tool_uses
      type: array
      description: A list of tool invocations to run concurrently; each invocation specifies a functions.*
        tool name and its JSON parameters.
      required: true
    input_format: 'JSON only. Expects one JSON object with shape: { "tool_uses": [ { "recipient_name":
      "functions.<tool_name>", "parameters": { ...tool-specific JSON args... } } ] }. Each tool_uses[i].parameters
      must be JSON and conform exactly to the called tool’s parameter schema (no free-form text).'
    output_format: An aggregated result containing the outputs of each tool call; conceptually one result
      per tool invocation, in the same order as the tool_uses list.
    restrictions:
    - Only tools in the functions namespace are allowed; recipient_name must start with functions. and
      be one of the registered tools.
    - Intended only for calls that do not depend on each other’s outputs; dependent calls must be done
      sequentially.
    - 'Each called tool’s schema still applies: correct field names/types, required fields present, and
      numerical constraints respected (example given: reimbursement amounts must be > 0).'
    - Cannot invoke arbitrary operations; only specific existing tools defined under functions.* can be
      called.
    - No numeric limits specified by the wrapper, but practical platform/runtime limits may apply (time,
      payload size, max parallel calls); may need to split into batches if hit.
    examples:
    - "{\n  \"tool_uses\": [\n    {\n      \"recipient_name\": \"functions.list_expense_reports\",\n \
      \     \"parameters\": { \"status\": \"submitted\" }\n    },\n    {\n      \"recipient_name\": \"\
      functions.list_vendor_accounts\",\n      \"parameters\": { \"query\": \"Delta\" }\n    }\n  ]\n}"
    - "{\n  \"tool_uses\": [\n    {\n      \"recipient_name\": \"functions.get_expense_report\",\n   \
      \   \"parameters\": { \"report_id\": \"RPT-10012\" }\n    },\n    {\n      \"recipient_name\": \"\
      functions.get_expense_report\",\n      \"parameters\": { \"report_id\": \"RPT-10087\" }\n    }\n\
      \  ]\n}"
    security_notes: Only tools in the functions namespace are permitted; recipient_name must be functions.<function_name>
      and must refer to a registered tool (no arbitrary operations).
