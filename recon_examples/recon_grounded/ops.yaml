      - `/var/log/syslog` isn’t present (and `/var/log/messages` also doesn’t exist).

      - `journalctl` isn’t installed (`/bin/sh: 1: journalctl: not found`).

      - `/var/log/` only contains a few package-manager logs (`dpkg.log`, `alternatives.log`, `apt/`)
