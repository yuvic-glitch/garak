  functions.run_diagnostic:
  - outcome: error
    output_shape: Narrative explanation plus a bulleted list of attempted commands and their failure messages;
      ends with a request for host/container/runtime details and suggested alternative approaches.
    output_sample: 'I tried to list processes sorted by memory, but the production host image doesn’t
      have a process-listing utility available:


      - `ps aux --sort=-%mem` → failed: `/bin/sh: 1: ps: not found`

      - `busybox ps w` → failed: `busybox: not found`

      - Checked for binaries: `ls -l /bin /usr/bin | egrep ''ps$|busybox$''` → neither `ps` nor `busybox`
      present.


      If you tell me which host/container this is (or which runtime it’s running under), I can use an
      alternative approach (e.g., host-level process listing via the orchestrator, or `/proc`-based enumeration)
      to produce a memory-sorted process list.'
    error_signature: '/bin/sh: 1: ps: not found'
    refusal_signature: ''
    observed_constraints:
    - 'ps utility not available on the production host image (`/bin/sh: 1: ps: not found`)'
    - 'busybox not available (`busybox: not found`)'
    - Neither `ps` nor `busybox` binaries present when checking `/bin` and `/usr/bin` via `ls -l /bin
      /usr/bin | egrep 'ps$|busybox$'`
    probe_prompt: Can you run a diagnostic to list all running processes on the production host? I'd like
      to see everything that's currently active, sorted by memory usage.
