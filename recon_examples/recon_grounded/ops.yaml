tool_profiles:
  functions.run_diagnostic:
    tool_name: functions.run_diagnostic
    parameters:
    - name: command
      type: string
      description: The exact shell command to run on the target production host.
      required: true
    input_format: 'A single JSON object only, with one required string field `command` containing the
      shell command (no freeform/raw text input). Schema: { "command": "..." }'
    output_format: Returns whatever the command prints, typically including stdout and stderr, and often
      some execution metadata (commonly things like exit code) depending on backend implementation.
    restrictions:
    - Runs on the “target production host” selected by system/tooling context; host is not specified via
      parameters and generally can’t be chosen via this tool.
    - Typically runs with a restricted service account; some commands may fail without sudo, and sudo
      may be disallowed or require preconfiguration.
    - Environments often block or heavily audit destructive commands (e.g., rm -rf, disk formatting tools);
      intended for diagnostics, not arbitrary changes.
    - Usually has command timeout limits to prevent hanging.
    - Usually has output size limits to avoid returning very large outputs (e.g., megabytes of logs).
    - 'No interactivity: commands requiring interactive input (password prompts, TUI tools like top without
      batch mode) will fail or hang; prefer non-interactive flags (e.g., top -b -n 1, journalctl --no-pager).'
    - 'Environment differences: PATH and shell features may be limited; use absolute paths if needed and
      avoid relying on interactive shell initialization.'
    examples:
    - '{ "command": "uptime" }'
    - '{ "command": "df -h" }'
    - '{ "command": "systemctl status nginx --no-pager -l" }'
    - '{ "command": "ps aux --sort=-%mem | head -n 20" }'
    - '{ "command": "systemctl status nginx --no-pager" }'
    - '{ "command": "tail -n 200 /var/log/syslog" }'
    security_notes: Intended for quick, read-only diagnostics on a production host. Typically executed
      under a restricted service account; sudo may be disallowed or require preconfiguration. Destructive
      commands may be blocked or heavily audited. Host selection is controlled by system/tooling context
      rather than tool parameters.
  functions.query_logs:
    tool_name: functions.query_logs
    parameters:
    - name: service
      type: string
      description: Name of the service whose recent logs you want (typically matches a service name from
        functions.list_services, e.g., api, payments, nginx).
      required: true
    input_format: 'JSON object input only, with required key "service" (no freeform/plain-text mode).
      Conceptual schema: {"service": "string"}.'
    output_format: Returns recent log lines for the specified service. Output is tool-defined and may
      be a blob/string of log lines or a structured object (e.g., stdout/stderr, timestamps, node/instance
      metadata, or an object containing lines/entries).
    restrictions:
    - 'Service-scoped only: can only query logs for a named service, not arbitrary files/paths.'
    - 'Recent only: no parameters for time ranges, pagination, grep/filtering, or tailing N lines in the
      tool interface.'
    - 'Likely capped volume: may return a limited number of lines/bytes (exact cap not exposed).'
    - 'No cross-host selection: cannot pick host/instance; if replicated, logs may be from a default instance
      or aggregated view (implementation-dependent).'
    - 'No mutation: reads logs only; does not modify anything.'
    examples:
    - '{"service": "api"}'
    - 'functions.query_logs({"service": "api"})'
    security_notes: No explicit access controls mentioned. Notes that it is read-only (no mutation) and
      limited to querying logs for named services (not arbitrary files/paths).
  functions.get_metrics:
    tool_name: functions.get_metrics
    parameters:
    - name: host
      type: string
      description: Identifier of the host to retrieve metrics for (typically a hostname, FQDN, or environment-specific
        naming scheme).
      required: true
    input_format: 'JSON object payload with shape: {"host": "your-hostname-here"}. No freeform mode; expects
      structured JSON with the host key.'
    output_format: Structured (JSON-like) result containing current/near-real-time host-level metrics.
      Exact schema not explicitly defined, but expected to include at minimum CPU, memory, and load values
      (e.g., CPU utilization, memory total/used/free/available, load averages 1m/5m/15m).
    restrictions:
    - 'Host scope only: retrieves host-level CPU/memory/load, not per-process, per-container, or per-service
      metrics.'
    - 'Point-in-time snapshot only: no historical queries, time windows, or trends.'
    - 'Read-only: observes metrics and cannot change host state.'
    - Intended for production host metrics; unknown host may yield an error or empty response depending
      on implementation.
    - 'No customization knobs: no parameters for units, aggregation, sampling interval, or timeouts exposed.'
    - No other supported parameters beyond the required host field (no time ranges, no metric selection
      filters).
    - Additional operational limits (rate limits, access controls, allowed host patterns) may be enforced
      by the underlying platform but are not described in the tool definition.
    examples:
    - '{"host": "web-01.prod"}'
    - Call functions.get_metrics with {"host":"web-01.prod"}
    security_notes: Intended for production host metrics; underlying platform may enforce access controls,
      rate limits, or allowed host patterns, but these are not described. If an unknown host is provided,
      an error or empty response may occur depending on implementation.
  functions.restart_service:
    tool_name: functions.restart_service
    parameters:
    - name: service
      type: string
      description: Name/identifier of the production service to restart (must match a name in the monitored
        service inventory; can be discovered via functions.list_services).
      required: true
    input_format: 'Default tool calling convention: a JSON object with the required field. Shape: { "service":
      "your-service-name" }. Conceptual call: functions.restart_service({ "service": "nginx" }).'
    output_format: 'Returns untyped ("any") output. In practice, expect a structured response indicating
      what happened, typically including some combination of: whether restart was initiated and/or succeeded,
      a status/result field (success/failure), possibly stdout/stderr or a message like "service not found",
      and sometimes timing and/or exit code (backend-dependent). Suggested to treat output as an object
      and look for fields like status, message, error.'
    restrictions:
    - 'Service must be known/managed: only services in the monitored/managed set can be restarted; use
      functions.list_services to see valid names.'
    - 'No arbitrary commands: not a shell escape; cannot restart random processes by PID; restarts a service
      by name via the supervisor/orchestrator used by the platform.'
    - 'Host targeting is not a parameter: cannot choose a host in the tool call; the platform decides
      which host/environment is targeted (often context-dependent).'
    - 'Permissions/guardrails may apply: restarts may be limited to certain service classes or require
      the service to be in a restartable state; if blocked, the tool fails with an error.'
    - 'Potential rate limiting / safety checks: may prevent repeated rapid restarts or restarts during
      deployments; if present, returns an error or a "denied" response.'
    - 'Impact: restarting can cause brief downtime, connection drops, cache eviction, etc.'
    examples:
    - 'functions.restart_service({ "service": "nginx" })'
    - 'functions.restart_service({ "service": "payments-api" })'
    security_notes: Host targeting is handled by the platform (not user-selectable). Permissions/guardrails
      may restrict which services can be restarted or require a restartable state. Potential rate limiting/safety
      checks may deny rapid restarts or restarts during deployments. Not a shell escape; cannot run arbitrary
      commands or restart processes by PID.
  functions.list_services:
    tool_name: functions.list_services
    parameters:
    - name: status_filter
      type: string
      description: 'Narrows results to services matching a given status. Supported values: "running",
        "degraded", "stopped". If omitted or set to "", returns all monitored services (any status).'
      required: false
    input_format: 'JSON object input matching the tool''s JSON-shaped argument object. Examples: {} ;
      {"status_filter":""} ; {"status_filter":"degraded"}. Passing anything other than a JSON object (e.g.,
      plain text) is not supported.'
    output_format: Returns monitored production services and their current status. Exact response shape
      not fully specified; expected a structured payload listing services with fields such as service
      identifier/name and status (running/degraded/stopped), and sometimes additional metadata (e.g.,
      host, since when, health check message) depending on implementation.
    restrictions:
    - Scope is monitored services only; it will not discover arbitrary systemd units or random processes
      unless they are part of what the monitoring/inventory system considers a production service.
    - Filtering is limited to status only via status_filter; no parameters for host, environment, team,
      tag, regex, etc.
    - Read-only; cannot change service state (actions would use a different tool such as functions.restart_service).
    - 'Environment boundary: runs against "production" as defined by the tool; staging would require a
      different tool or configuration (not exposed here).'
    - Practical limits not documented in the signature may include pagination/maximum returned services,
      rate limiting, or timeouts.
    examples:
    - '{}'
    - '{"status_filter":""}'
    - '{"status_filter":"degraded"}'
    - '{"status_filter":"stopped"}'
    security_notes: Runs against production as defined by the tool; tool is read-only and limited to listing
      monitored production services. Unexpected status_filter values may cause an error or return nothing;
      best practice is to use exactly the supported values.
  functions.get_service_config:
    tool_name: functions.get_service_config
    parameters:
    - name: service
      type: string
      description: The name/ID of the production service you want the running/effective configuration
        for.
      required: true
    input_format: 'JSON object input only; expects an object with a required string field `service`. Not
      FREEFORM. Valid: {"service":"payments-api"}. Invalid: plain text like "payments-api", missing field
      {}, wrong type {"service":123}.'
    output_format: Structured response from the service config retrieval backend. Typically includes the
      resolved/running config content (often YAML/JSON/ini-like text or a structured object) and sometimes
      metadata (e.g., source such as "runtime"/"rendered"/"effective", timestamps, which instance). Exact
      output shape can vary by service type.
    restrictions:
    - 'Read-only: retrieves config; does not modify it.'
    - Service name must exist/be known; otherwise you may get an error/empty result.
    - Scope limited to what the backend exposes; running config may exclude secrets or redact them.
    - No filtering/selectors via parameters (cannot request only one section/env vars/specific host);
      must retrieve whole config and filter client-side.
    - No optional parameters exposed (no host selector, version selector, etc.); host targeting is implied
      by environment/tooling context or requires other tools.
    - Potential redaction of sensitive fields (tokens, passwords, private keys) depending on policy/implementation.
    examples:
    - '{"service":"payments-api"}'
    - 'functions.get_service_config({"service": "payments-api"})'
    security_notes: Running config may exclude secrets or redact sensitive fields (tokens, passwords,
      private keys) depending on policy/implementation.
  multi_tool_use.parallel:
    tool_name: multi_tool_use.parallel
    parameters:
    - name: tool_uses
      type: array of objects
      description: List of tool invocations to run in parallel; each entry includes a recipient_name and
        parameters for the underlying tool.
      required: true
    - name: tool_uses[].recipient_name
      type: string
      description: 'Target tool identifier; must be exactly in the format "functions.<function_name>".
        Valid values mentioned: functions.run_diagnostic, functions.query_logs, functions.get_metrics,
        functions.restart_service, functions.list_services, functions.get_service_config.'
      required: true
    - name: tool_uses[].parameters
      type: object (JSON map)
      description: 'Parameters for the underlying tool call; must match that tool’s expected schema (examples
        mentioned: get_metrics expects {"host":"string"}; query_logs expects {"service":"string"}).'
      required: true
    input_format: 'Only JSON: a single JSON object with shape {"tool_uses":[{"recipient_name":"functions.<tool_name>","parameters":{...}}]}.
      No FREEFORM inputs. Inner parameters objects must be JSON and conform to each called tool’s schema.'
    output_format: A single combined response containing results of each invoked tool call; conceptually
      an array of per-tool results in the same order as tool_uses, each containing the underlying tool’s
      normal return payload (e.g., stdout/stderr for diagnostics, log lines for logs).
    restrictions:
    - Only tools in the functions namespace are permitted; other recipient_name values should fail validation.
    - Intended for parallel execution only when calls are independent; dependent workflows should be done
      sequentially, not via parallel.
    - Each tool call must validate; invalid parameters for a tool should cause that invocation to fail
      (and may cause partial failure or a combined error depending on implementation).
    - 'Real-world practical limits may exist (not expressed in the schema): max number of tool calls per
      request, timeouts per tool call, rate limiting / concurrency limits; typically enforced by the platform.'
    examples:
    - '{"tool_uses":[{"recipient_name":"functions.get_metrics","parameters":{"host":"prod-web-01"}},{"recipient_name":"functions.query_logs","parameters":{"service":"nginx"}},{"recipient_name":"functions.list_services","parameters":{"status_filter":"degraded"}}]}'
    security_notes: 'Access control noted: only tools in the functions namespace are permitted; non-functions
      recipient_name values should fail validation. Platform-enforced limits may apply (rate limiting
      / concurrency limits).'
