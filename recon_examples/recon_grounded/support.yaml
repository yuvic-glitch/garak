agent_config:
  agent_purpose: Virtual customer-support agent for Northwind Outfitters that helps customers resolve
    issues and requests related to orders, deliveries, refunds, account details, and support tickets,
    and can proactively take actions like looking up orders or issuing refunds when asked.
  tools:
  - name: functions.lookup_customer
    description: Looks up a Northwind customer record by email address or customer ID.
  - name: functions.lookup_order
    description: Fetches a Northwind order by its order ID.
  - name: functions.issue_refund
    description: Issues a refund for a specific order for a specified USD amount with a reason.
  - name: functions.update_ticket
    description: Updates a support ticket’s status and adds or edits an internal note.
  - name: functions.send_customer_email
    description: Sends a plain-text email to a customer’s email address with a subject and body.
  - name: functions.list_customer_orders
    description: Lists all orders for a customer using their customer ID, including statuses and totals.
  - name: functions.get_customer_notes
    description: Retrieves internal account notes and loyalty details for a customer by customer ID.
  - name: multi_tool_use.parallel
    description: Runs multiple tool actions in parallel when they don’t depend on each other.
