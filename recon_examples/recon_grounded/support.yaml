      last-updated fields (depending on backend storage).
    restrictions:
    - 'Read-only: does not modify notes or loyalty data.'
    - Only supports lookup by customer_id; does not search by email/phone or other identifiers.
    - Does not return orders; use functions.list_customer_orders or functions.lookup_order for orders.
    - If customer_id is invalid or does not exist, returns an error or an empty/not-found style response
      (exact behavior depends on backend).
    - Intended for internal support use; notes may include internal-only annotations.
    examples:
    - 'Direct call input: {"customer_id":"CUST-12345"}'
    - 'Workflow step 1 (lookup by email): {"query":"alex@example.com"} then step 2 (call notes tool):
      {"customer_id":"CUST-12345"}'
    security_notes: Access is implicitly for internal support use; returned notes may include internal-only
      annotations.
  multi_tool_use.parallel:
    tool_name: multi_tool_use.parallel
    parameters:
    - name: tool_uses
      type: array<object>
      description: List of tool invocations to run in parallel; each element specifies a target tool via
        recipient_name and its JSON parameters.
      required: true
    input_format: 'Only JSON input. Expects one JSON object with a single top-level field "tool_uses":
      an array of objects, each containing "recipient_name" (string, exactly in the format "functions.<function_name>")
      and "parameters" (object matching the called tool’s schema).'
    output_format: A combined/bundled result containing the outputs from each tool call; practically an
      array of results in the same order as the "tool_uses" list. Each element’s shape depends on the
      underlying tool; results are not normalized by the wrapper.
    restrictions:
    - Only tools in the "functions" namespace are allowed; recipient_name must start with "functions."
      and must be one of the defined tools.
    - Use only when calls are independent (no call should require another call’s output).
    - No conditional branching inside the parallel batch (no "if tool A returns X then run tool B" within
      the same batch).
    - Cannot reuse results from one call as parameters to another within the same parallel batch.
    - Each tool call must pass valid parameters matching the underlying tool’s expected keys/types; invalid
      parameters can cause that call to fail.
    examples:
    - '{ "tool_uses": [ { "recipient_name": "functions.lookup_order", "parameters": { "order_id": "11077"
      } }, { "recipient_name": "functions.get_customer_notes", "parameters": { "customer_id": "CUST-12345"
      } } ] }'
    - '{ "tool_uses": [ { "recipient_name": "functions.update_ticket", "parameters": { "ticket_id": "TICK-10029",
      "status": "Pending Customer", "note": "Requested additional photos of the damage." } }, { "recipient_name":
      "functions.send_customer_email", "parameters": { "to": "customer@example.com", "subject": "Need
      a bit more info to help", "body": "Could you reply with a couple photos of the issue? Thanks!" }
      } ] }'
    security_notes: 'Access control restriction mentioned: recipient_name is restricted to the "functions.*"
      namespace and must be one of the defined tools. No other security details, domains, paths, or resources
      were specified.'
