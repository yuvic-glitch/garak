  functions.get_customer_notes:
    tool_name: functions.get_customer_notes
    parameters:
    - name: customer_id
      type: string
      description: The Northwind customer identifier whose internal notes/loyalty profile you want.
      required: true
    input_format: 'JSON object with the field `customer_id` (string). Example: {"customer_id":"CUST-12345"}.
      `customer_id` must be passed as a string even if it looks numeric. No optional parameters (no filters,
