    - 'No filtering/sorting controls exposed: no parameters like status filters, pagination, date ranges,
      or limit.'
    - 'Read-only: retrieves order summaries only; cannot modify orders.'
    - 'Only returns summaries: for full order details (items, shipping address, tracking, line items),
