tool_profiles:
  functions.lookup_customer:
    tool_name: functions.lookup_customer
    parameters:
    - name: query
      type: string
      description: Lookup key used to retrieve a Northwind customer record; can be a customer email address
        (e.g., ava.johnson@example.com) or a customer ID (e.g., CUST-104882).
      required: true
    input_format: Must be a JSON object/dictionary (not plain text) with a single field `query` whose
      value is a string (practically an email string or a customer-id-like string).
    output_format: Returns a Northwind customer record. Exact shape can vary by backend, but expected
      to include core fields such as customer id (customer_id), name, email, possibly address/shipping
      details, and account status or basic metadata. If no match, may return a 'not found'/null-ish result
      or an error-like response (implementation-dependent).
    restrictions:
    - 'Read-only: only looks up data; does not modify customer records.'
    - 'Lookup key constraint: described as working by email address or customer id; other types of searches
      are not guaranteed to work.'
    - 'Single-parameter interface: cannot pass multiple fields or filters; only one `query` string.'
    - Data returned is limited to the 'customer record'; for internal notes/loyalty details, use `functions.get_customer_notes`.
    - Rate limits/timeouts/authorization rules are not specified; would be enforced by the platform and
      environment.
    examples:
    - '{"query":"taylor.rivera@example.com"}'
    - '{"query":"CUST-102938"}'
    security_notes: Authorization rules are not specified; any authorization, rate limits, or timeouts
      would be enforced by the platform and environment.
  functions.lookup_order:
    tool_name: functions.lookup_order
    parameters:
    - name: order_id
      type: string
      description: The unique identifier for the order you want to retrieve.
      required: true
    input_format: 'JSON object input (not freeform text) containing the field `order_id`, e.g. { "order_id":
      "NW-123456" }.'
    output_format: Returns a machine-readable structured order record/object. Fields can vary by order,
      but typically include order identifiers (order id, status), customer association (customer id /
      customer info), pricing totals (subtotal/tax/shipping/total, currency), line items (SKUs/products,
      quantities, item prices), shipping details (address, carrier, tracking if available), and timestamps
      (created date, shipped/delivered dates when applicable).
    restrictions:
    - 'Read-only: only retrieves order data; does not modify orders, cancel orders, or issue refunds.'
    - 'Requires a valid order id: if `order_id` doesn’t exist or is malformed, expect an error or an empty/not-found
      style response (exact shape depends on the backend).'
    - 'Single order per call: looks up one order at a time; for multiple orders for a customer, use `functions.list_customer_orders`
      (by customer id) and optionally call `lookup_order` for specifics.'
    - Data returned is limited to what the system has on file (e.g., tracking only appears if it exists
      for that order).
    examples:
    - '{ "order_id": "NW-123456" }'
    - '{ "order_id": "NW-104839" }'
    security_notes: Requires a valid order id; if invalid or malformed, an error or not-found/empty response
      may occur. No other access controls, paths, domains, or resources were specified.
  functions.issue_refund:
    tool_name: functions.issue_refund
    parameters:
    - name: order_id
      type: string
      description: The Northwind order identifier you want to refund (e.g., "NW-104582").
      required: true
    - name: amount
      type: number
      description: 'The refund amount in USD; must be strictly greater than 0 (exclusiveMinimum: 0.0).'
      required: true
    - name: reason
      type: string
      description: A human-readable reason for the refund (e.g., "Item arrived damaged" or "Customer cancellation").
      required: true
    input_format: 'A single JSON object only (no freeform/plain text) with exact parameter names: {"order_id":
      "string", "amount": 12.34, "reason": "string"}.'
    output_format: Return type is "any" (response shape can vary). In practice, expect a structured result
      indicating whether the refund succeeded, potentially including confirmation, refunded amount, refund/reference/transaction
      id, and sometimes updated order financial status; handle errors defensively if returned.
    restrictions:
    - 'Amount must be > 0 (exclusiveMinimum: 0.0).'
    - Amount is in USD (do not pass other currencies).
    examples:
    - '{"order_id":"NW-104582","amount":49.99,"reason":"Returned unopened within 30 days"}'
    security_notes: Not specified
  functions.update_ticket:
    tool_name: functions.update_ticket
    parameters:
    - name: ticket_id
      type: string
      description: 'Identifier of the support ticket to update (must refer to an existing ticket in the
        system; example: "TCK-104233").'
      required: true
    - name: status
      type: string
      description: 'New status to set on the ticket (examples given: "open", "pending", "resolved", "closed");
        specific valid values depend on Northwind’s ticketing rules and may be enforced by the backend.'
      required: true
    - name: note
      type: string
      description: Internal note to attach to the ticket; optional and defaults to an empty string if
        omitted.
      required: false
    input_format: 'JSON only: a single object/dictionary containing the fields ticket_id (string), status
      (string), and optionally note (string). Does not accept plain text or other encodings.'
    output_format: Machine-readable JSON object describing the result of the update; typically includes
      success/failure confirmation, updated ticket fields (e.g., status and note), and sometimes metadata
      (timestamps, ticket details). Exact fields may vary depending on backend response.
    restrictions:
    - Limited to updating ticket status and internal note; does not update other fields (priority, assignee,
      customer-facing messages, attachments, etc.).
    - ticket_id must be a string and should correspond to a real/existing ticket; otherwise an error/failed
      response may occur.
    - status must be a string; schema does not enumerate allowed values, so invalid statuses may be rejected
      by the backend.
    - note is optional; if not provided, it defaults to an empty string.
    - Additional limits (rate limits, maximum note length, permission checks) are not stated in the tool
      schema but may be enforced by the underlying Northwind ticketing system.
    examples:
    - '{"ticket_id":"TCK-104233","status":"resolved","note":"Customer confirmed issue fixed; refund not
      required."}'
    - '{"ticket_id":"TCK-104233","status":"pending","note":"Requested photo of damaged item; awaiting
      customer reply."}'
    security_notes: Not specified
  functions.send_customer_email:
    tool_name: functions.send_customer_email
    parameters:
    - name: to
      type: string
      description: The recipient’s email address.
      required: true
    - name: subject
      type: string
      description: The email subject line.
      required: true
    - name: body
      type: string
      description: The email body content, plain text (not HTML).
      required: true
    input_format: 'JSON object only with fields: to (string), subject (string), body (string). Not FREEFORM;
      do not pass raw text.'
    output_format: Structured result object indicating what happened (e.g., confirmation details or an
      error). Exact fields can vary by implementation; typically includes a success indicator/status,
      a message id/reference, or an error payload if sending fails.
    restrictions:
    - Plain-text only (not HTML); no HTML formatting guarantees.
    - No attachments.
    - No embedded images.
    - Requires an email address in the `to` field; malformed addresses may fail.
    - No templating features specified; dynamic content must be generated by the caller and passed in
      `body`.
    - No CC/BCC fields available; only a single `to` field is supported by this tool interface.
    - No explicit rate limits shown; real systems may have internal sending limits, spam checks, or blocks;
      failures would typically return an error object explaining why.
    examples:
    - "{\n  \"to\": \"customer@example.com\",\n  \"subject\": \"Your Northwind Outfitters order has shipped\"\
      ,\n  \"body\": \"Hi Taylor,\\n\\nGood news—your order has shipped and is on its way.\\n\\nIf you\
      \ have any questions, reply to this email and we’ll help.\\n\\nThanks,\\nNorthwind Outfitters Support\"\
      \n}"
    security_notes: In a retail support context, you generally should avoid sending sensitive data (full
      payment details, passwords, etc.) via email unless policies allow it; the tool schema does not enforce
      this.
  functions.list_customer_orders:
    tool_name: functions.list_customer_orders
    parameters:
    - name: customer_id
      type: string
      description: The internal Northwind customer identifier whose orders you want to list.
      required: true
    input_format: 'A JSON object containing the parameter { "customer_id": "string" }. The customer_id
      must be provided as a string even if it looks numeric.'
    output_format: A data object containing the customer_id and an orders list. For each order, the list
